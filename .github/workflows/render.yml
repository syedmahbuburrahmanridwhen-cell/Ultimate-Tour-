name: Render Video

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Move component files into components folder
        run: |
          mkdir -p components
          mv Backdrop.tsx PreviewAudio.tsx Scene1Hook.tsx Scene2Intro.tsx Scene3Bento.tsx Scene4Hub.tsx Scene5Cta.tsx Scene6Contact.tsx Scene7End.tsx SceneShell.tsx SfxLayer.tsx Sweep.tsx ui.tsx motion.tsx components/ 2>/dev/null || true

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Ensure Remotion Browser
        run: npx remotion browser ensure

      - name: Render video
        run: npx remotion render index.ts Main out/video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v4
        with:
          name: promo-video
          path: out/video.mp4
