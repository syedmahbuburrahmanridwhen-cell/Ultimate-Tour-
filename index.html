/* ===== core/helpers-messages.js ===== */
// ======================================================================
// @@HELPER-MESSAGES   Message line above buttons: say(), error text, failAnim()
//   The ball "writes" messages here.
// ======================================================================
const say=(root,t,ok)=>{let p=root.querySelector('.slot');if(!p){p=document.createElement('p');p.className='msg slot';root.querySelector('.btn').before(p)}p.textContent=t||'';p.style.clipPath='';p.style.color=ok?'#0d9488':'#d6452a'};
const errText=e=>E[e.code]||'Something went wrong ('+(e.code||e.message)+')';
async function failAnim(btn,root,text){const slot=root.querySelector('.slot');if(!slot){say(root,text);return}
  const g=gAnim(btn,true);try{await g.eat();await new Promise(r=>setTimeout(r,350));await g.fail(text,slot)}catch(x){g.reset();say(root,text)}}

</script>
<script type="text/plain" data-kind="app" data-order="40">
/* ===== core/helpers-buttons.js ===== */
// ======================================================================
// @@HELPER-BUTTONS   Button helpers: restoreBtn, countdown (cdStart), btnWrite
//   Create / Send-link countdown lives here.
// ======================================================================
// A pill button left blank by its gather animation gets its dot and text back
function restoreBtn(b){b.querySelectorAll('.gsp').forEach(x=>x.remove());const i=b.querySelector('i'),t=b.querySelector('span');
  gsap.killTweensOf([i,t]);gsap.set([i,t],{x:0,scale:1,opacity:1});t.style.clipPath='';b.style.overflow=b.style.position=''}
// Cooldown on a button: label shows a live countdown (e.g. Create 79s); clicking early shakes the label
function cdMarkup(tx,base,txt){tx.textContent=base;const cd=document.createElement('em');cd.className='cdt';cd.textContent=txt;tx.append(cd);return cd}
function cdStart(btn,sec,base){const tx=btn.querySelector('span');clearInterval(btn._i);btn._at=Date.now()+sec*1000;
  const cd=cdMarkup(tx,base,'');
  const tick=()=>{const n=Math.ceil((btn._at-Date.now())/1000);
    if(n>0){cd.textContent=' '+n+'s';return}
    clearInterval(btn._i);btn._at=0;
    gsap.to(cd,{width:0,opacity:0,duration:.7,ease:'power3.inOut',onComplete:()=>{tx.textContent=base}})};
  tick();btn._i=setInterval(tick,250)}
const cdReady=btn=>!btn._at||Date.now()>=btn._at;
// The ball comes back, writes the label with the timer, and settles into the dot's place
async function btnWrite(btn,base,sec){
  UI=true;
  try{
    restoreBtn(btn);
    const lg=btn.querySelector('i'),tx=btn.querySelector('span');
    cdMarkup(tx,base,' '+sec+'s');gsap.set(lg,{opacity:0});tx.style.clipPath='inset(0 100% 0 0)';
    const B=btn.getBoundingClientRect(),L=lg.getBoundingClientRect(),T=tx.getBoundingClientRect(),cx=B.left+B.width/2,cy=B.top+B.height/2;
    const bl=document.createElement('div');
    Object.assign(bl.style,{position:'fixed',left:cx-7+'px',top:cy-7+'px',width:'14px',height:'14px',borderRadius:'50%',background:'#fff',zIndex:96,pointerEvents:'none'});
    document.body.append(bl);gsap.set(bl,{scale:.2,opacity:0});
    await fin(gsap.to(bl,{scale:1,opacity:1,duration:.3,ease:'back.out(2)'}));
    await fin(gsap.to(bl,{left:T.left-7,duration:.45,ease:'power3.inOut'}));
    const o={v:T.left};
    await fin(gsap.to(o,{v:T.right,duration:Math.min(1.2,.3+tx.textContent.length*.03),ease:'none',onUpdate:()=>{tx.style.clipPath='inset(0 '+(T.right-o.v)+'px 0 0)';bl.style.left=(o.v-7)+'px'}}));
    tx.style.clipPath='';
    await fin(gsap.timeline().to(bl,{left:L.left+L.width/2-7,duration:.5,ease:'power3.inOut'}).to(bl,{opacity:0,duration:.15}).to(lg,{opacity:1,duration:.2},'<'));
    bl.remove();cdStart(btn,sec,base)
  }finally{UI=false}}

</script>
<script type="text/plain" data-kind="app" data-order="50">
/* ===== core/helpers-run.js ===== */
// ======================================================================
// @@HELPER-RUN   run() wrapper, one-action-at-a-time lock, animRun(), popIn()
//   Every dark pill button goes through run() + animRun().
// ======================================================================
async function absorb(root,btn){const p=root.querySelector('.slot');if(!p||!p.textContent)return;
  const S=p.getBoundingClientRect(),B=btn.getBoundingClientRect();
  await fin(gsap.to(p,{y:B.top+B.height/2-(S.top+S.height/2),scale:.15,opacity:0,transformOrigin:'50% 50%',duration:.45,ease:'power3.in'}));
  p.textContent='';p.style.clipPath='';gsap.set(p,{clearProps:'transform,opacity'})}
async function run(btn,root,fn,dim){if(working||UI)return;working=true;if(dim!==false)btn.style.opacity='.6';await absorb(root,btn);
  try{await fn()}catch(e){if(!/popup-closed|cancelled-popup/.test(e.code||'')){const t=errText(e);if(e.shown){}else if(btn.matches('.btn'))await failAnim(btn,root,t);else say(root,t)}}
  finally{working=false;btn.style.opacity=''}}
// one action at a time: while any animation runs, other buttons ignore clicks; leaving a page clears its message
document.addEventListener('click',e=>{const b=e.target.closest&&e.target.closest('.btn,.gbtn,.forgot,.signup button,#back');if(!b)return;
  if(b.dataset.skip){delete b.dataset.skip;return}
  if(UI||working||busy){e.stopImmediatePropagation();e.preventDefault();return}
  if(b.matches('#login .signup button,#back,.forgot,#rs_back,#rs_x,#v_x')){
    const clr=()=>document.querySelectorAll('.slot').forEach(p=>{p.textContent='';p.style.clipPath=''});
    const root=b.closest('.lg'),sl=root&&root.querySelector('.slot');
    if(sl&&sl.textContent){e.stopImmediatePropagation();e.preventDefault();UI=true;
      absorb(root,sl.nextElementSibling||b).then(()=>{UI=false;clr();b.dataset.skip=1;b.click()});return}
    clr()}},true);
const topPg=()=>[...document.querySelectorAll('#home,#verify,#rs1,#rs2,#rs3,#rs4')].filter(p=>p.style.display==='flex').pop()||document.body;
async function animRun(btn,job,show,after){const g=gAnim(btn,true);try{const w=job();w.catch(()=>{});await g.eat();const r=await w;await g.done();if(after){await after(r);g.reset();return}await g.expand();(show||(x=>x&&x.uid?showVerify(x):enter(x)))(r);g.fade()}
  catch(e){const root=btn.closest('#sgf')||btn.closest('.lg'),slot=root&&root.querySelector('.slot');
    if(slot&&!/popup-closed|cancelled-popup/.test(e.code||'')){try{await g.fail(errText(e),slot);e.shown=true}catch(x){g.reset()}}else g.reset();
    throw e}}
function popIn(els,delay){els=[...els];els.forEach(x=>{x.style.transition='none'});
  gsap.from(els,{y:24,opacity:0,duration:.6,stagger:.08,delay:delay||0,ease:'power3.out',onComplete:()=>els.forEach(x=>{x.style.transition='';gsap.set(x,{clearProps:'transform'})})})}
function loginIn(){popIn(lgF.children,.1)}

</script>
<script type="text/plain" data-kind="app" data-order="60">
/* ===== core/anim-button.js ===== */
// ======================================================================
// @@ANIM-BUTTON   Button animations: gAnim() = gather > spinner > tick > expand (dark and Google buttons)
//   To restyle button animations, edit gAnim().
// ======================================================================
const fin=t=>new Promise(r=>t.eventCallback('onComplete',r));
function gAnim(btn,dark){
  const lg=btn.querySelector(dark?'i':'svg'),tx=btn.querySelector('span'),R=btn.getBoundingClientRect(),L=lg.getBoundingClientRect(),T=tx.getBoundingClientRect();
  const x0=Math.max(R.right-24-L.right,T.right-L.left-6),cx=R.left+R.width/2-(L.left+L.width/2);
  btn.style.position='relative';btn.style.overflow='hidden';lg.style.position='relative';lg.style.zIndex=2;
  const sp=document.createElement('div');sp.className='gsp';
  sp.innerHTML='<svg viewBox="0 0 30 30" width="30" height="30"><g class="rot"><circle cx="15" cy="15" r="11" pathLength="100" style="fill:rgba(79,116,244,0)" stroke="#4f74f4" stroke-width="3.2" stroke-linecap="round" stroke-dasharray="28 72"/></g><path class="tick" d="M9.5 15.5l4 4 7-8" fill="none" stroke="#0f1730" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" pathLength="100" stroke-dasharray="100" stroke-dashoffset="100"/></svg>';
  btn.append(sp);if(dark)sp.querySelector('circle').setAttribute('stroke','#fff');else sp.querySelector('.tick').setAttribute('stroke','#fff');
  const rot=sp.querySelector('.rot'),ring=sp.querySelector('circle'),tick=sp.querySelector('.tick');
  let spin,gx;
  const clip=()=>{const c=lg.getBoundingClientRect(),m=c.left+c.width/2;tx.style.clipPath='inset(0 0 0 '+Math.min(T.width,Math.max(0,m-T.left))+'px)'};
  const gather=()=>{const bc=R.left+R.width/2,tc=T.left+T.width/2,lc=L.left+L.width/2;
    const t=gsap.timeline().to(tx,{x:bc-tc,scale:0,opacity:0,duration:.55,ease:'power3.in'},0)
      .to(lg,{x:bc-lc,scale:2.6,duration:.55,ease:'power3.inOut'},0).to(lg,{scale:0,opacity:0,duration:.2},'-=.05')
      .fromTo(sp,{opacity:0,scale:.4},{opacity:1,scale:1,duration:.3,ease:'back.out(2)'},'<')
      .add(()=>{spin=gsap.to(rot,{rotation:360,svgOrigin:'15 15',duration:.8,repeat:-1,ease:'none'})},'<');
    return fin(t)};
  return{
    eat(){
      if(dark)return gather();
      const t=gsap.timeline().to(lg,{x:x0,scale:1.25,duration:.85,ease:'power2.inOut',onUpdate:clip})
        .to(lg,{x:cx,scale:1,duration:.45,ease:'power2.inOut'}).to(lg,{scale:0,opacity:0,duration:.2},'-=.1')
        .fromTo(sp,{opacity:0,scale:.4},{opacity:1,scale:1,duration:.3,ease:'back.out(2)'},'<')
        .add(()=>{spin=gsap.to(rot,{rotation:360,svgOrigin:'15 15',duration:.8,repeat:-1,ease:'none'})},'<');
      return fin(t)},
    done(){spin&&spin.kill();
      const t=gsap.timeline().to(ring,{strokeDasharray:'100 0',fill:dark?'#fff':'#4f74f4',duration:.3,ease:'power2.out'})
        .to(tick,{strokeDashoffset:0,duration:.35,ease:'power2.out'}).to(sp,{scale:1.2,duration:.12,yoyo:true,repeat:1}).to({},{duration:.3});
      return fin(t)},
    expand(){const r=btn.getBoundingClientRect();gx=document.createElement('div');
      Object.assign(gx.style,{position:'fixed',left:r.left+'px',top:r.top+'px',width:r.width+'px',height:r.height+'px',background:dark?'#4f74f4':'#fff',borderRadius:'99px',zIndex:95,boxSizing:'border-box'});
      gx.append(sp);document.body.append(gx);gsap.to(sp,{opacity:0,duration:.3,delay:.2});
      return fin(gsap.to(gx,{left:0,top:0,width:innerWidth,height:innerHeight,borderRadius:0,backgroundColor:'#eef2fb',duration:.85,ease:'power3.inOut'}))},
    fade(){gsap.to(gx,{opacity:0,duration:.45,onComplete:()=>gx.remove()});popIn(topPg()===document.body?[]:topPg().querySelectorAll('.lg>*'))},
    async fail(text,slot){
      spin&&spin.kill();
      const S=slot.getBoundingClientRect(),B=btn.getBoundingClientRect(),bx=B.left+B.width/2,by=B.top+B.height/2;
      const bl=document.createElement('div');
      Object.assign(bl.style,{position:'fixed',left:bx-7+'px',top:by-7+'px',width:'14px',height:'14px',borderRadius:'50%',background:dark?'#fff':'#4f74f4',zIndex:96,pointerEvents:'none',opacity:0});
      document.body.append(bl);
      await fin(gsap.timeline().to(sp,{scale:0,opacity:0,duration:.2}).to(bl,{opacity:1,duration:.15},'<'));
      slot.textContent=text;slot.style.color='#d6452a';
      const rg=document.createRange();rg.selectNodeContents(slot);const T=rg.getBoundingClientRect(),sy=S.top+S.height/2;
      slot.style.clipPath='inset(0 '+(S.right-T.left)+'px 0 0)';
      await fin(gsap.timeline().to(bl,{left:T.left-7,top:sy-7,duration:.55,ease:'power3.inOut'}));
      const o={v:T.left};
      await fin(gsap.to(o,{v:T.right,duration:Math.min(1.2,.3+text.length*.022),ease:'none',onUpdate:()=>{slot.style.clipPath='inset(0 '+(S.right-o.v)+'px 0 0)';bl.style.left=(o.v-7)+'px'}}));
      slot.style.clipPath='';
      await fin(gsap.timeline().to(bl,{left:bx-7,top:by-7,duration:.6,ease:'power3.inOut'}).to(bl,{scale:0,duration:.2})
        .to(lg,{x:0,scale:1,opacity:1,duration:.5,ease:'back.out(1.6)'},'<.05').to(tx,{x:0,scale:1,opacity:1,duration:.5,ease:'back.out(1.4)'},'<'));
      bl.remove();sp.remove();btn.style.overflow=btn.style.position='';gsap.set(lg,{x:0,scale:1,opacity:1})},
    reset(){spin&&spin.kill();gsap.killTweensOf([lg,sp,tick,ring]);sp.remove();gx&&gx.remove();gsap.set(lg,{x:0,scale:1,opacity:1});gsap.set(tx,{x:0,scale:1,opacity:1});tx.style.clipPath='';btn.style.overflow=btn.style.position=''}}}

</script>
<script type="text/plain" data-kind="app" data-order="70">
/* ===== core/anim-link.js ===== */
// ======================================================================
// @@ANIM-LINK   Text-link animation: underline > ball > burst / spinner > tick (lineAnim)
//   Used by Forgot password, Resend, Use another email, Back.
// ======================================================================
// Text-link animation: underline takes the text and becomes a ball. mode resend: spinner > tick > back to a line. mode burst: box to the middle, bursts, then cover() swaps the page
async function lineAnim(...a){UI=true;try{return await lineAnim0(...a)}finally{UI=false}}
async function lineAnim0(btn,job,cover){
  job.catch(()=>{});
  const r=btn.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,W=innerWidth,H=innerHeight;
  const ln=document.createElement('div');
  Object.assign(ln.style,{position:'fixed',left:r.left+'px',top:r.bottom-2+'px',width:r.width+'px',height:'2px',background:'#4f74f4',borderRadius:'1px',zIndex:95,pointerEvents:'none'});
  document.body.append(ln);btn.style.borderBottomColor='transparent';
  const sp=document.createElement('div');sp.className='gsp';sp.style.cssText='position:fixed;left:'+cx+'px;top:'+cy+'px;z-index:96';

// ======================================================================

//   Firestore read/write for players.
// ======================================================================
const getProfile=async u=>{const s=await getDoc(doc(db,'users',u.uid));return s.exists()?s.data():null};
const saveProfile=async(u,d)=>{await u.getIdToken(true);return runTransaction(db,async tx=>{const r=doc(db,'usernames',d.username);if((await tx.get(r)).exists())throw{code:'app/username-taken'};tx.set(r,{uid:u.uid});tx.set(doc(db,'users',u.uid),{...d,createdAt:serverTimestamp()})})};   // getIdToken(true): refresh the login token first, so the server rules see email_verified = true

Object.assign(AUTO,{show(){q('#login').style.visibility='hidden';home.style.zIndex=35;enter(AUTO.p,true)},reveal(){homeIn();setTimeout(()=>{home.style.zIndex=''},1600)}});
const sgOn=()=>getComputedStyle(q('#signup')).visibility==='visible';

const introDone=()=>new Promise(r=>{const w=()=>typeof tl!=='undefined'&&tl&&tl.progress()>=1?r():setTimeout(w,300);w()});

async function makeProfile(u){
  let d=null;try{d=JSON.parse(localStorage.getItem(PK)||'null')}catch(e){}
  if(d&&d.email===u.email.toLowerCase()){d={name:d.name,username:d.username,email:u.email,phone:d.phone||'',provider:'password'};
    try{await saveProfile(u,d);try{localStorage.removeItem(PK)}catch(e){}return d}catch(e){if(e.code!=='app/username-taken')throw e}}
  return autoProfile(u)}
// Google login: no extra details needed. Profile is auto-created on first use, then logo > spinner > tick > expand animation
async function autoProfile(u){
  const base=(u.email.split('@')[0].toLowerCase().replace(/[^a-z0-9_.]/g,'')||'player').slice(0,14).padEnd(3,'0');
  for(let i=0;i<8;i++){
    const d={name:u.displayName||base,username:i?base+Math.floor(1000+Math.random()*9000):base,email:u.email,phone:'',provider:u.providerData.some(x=>x.providerId==='google.com')?'google':'password'};
    try{await saveProfile(u,d);return d}catch(e){if(e.code!=='app/username-taken')throw e}}
  throw{code:'app/username-taken'}}

if(GFLAG&&!VERIFIED){skipIntro();
  (async()=>{await auth.authStateReady();await introDone();const u=auth.currentUser;
    if(!u){say(lgF,'Google sign-in not completed. Try again.');return}

for(const f of [lgF,sgF])f.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.tagName==='INPUT'){e.preventDefault();f.querySelector('.btn').click()}});

  if(working||pending||VERIFIED||GFLAG)return;
  try{const p=u.emailVerified?await getProfile(u):null;

  catch(e){if(AUTO.state==='wait')settle('login');if(!/unavailable|network/.test(e.code||''))await signOut(auth)}});


</script>

<script type="text/plain" data-kind="intro" data-order="10">
/* ===== pages/loading/loading-core.intro.js ===== */
// ======================================================================
// @@LOADING (shared)
// Shared by both loading animations: helpers, AUTO flag, DOM pieces, progress, and tail() = black strips -> login/home.
// ======================================================================
// @@LOADING - intro animation: scenes, timeline, start()  (down to the eye toggle)
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const SPEED=1; // 1 = normal, 1.5 = faster

// build DOM pieces
$('#g').innerHTML='<div class="arm"><i class="b"></i><i class="d"></i></div>'.repeat(8);
$('#word').innerHTML=[...'Ultimate Tour'].map(c=>`<span class="l">${c==' '?'&nbsp;':c}</span>`).join('');
const D=[];
for(let i=0;i<16;i++){const e=document.createElement('i'),s=.5+Math.random()*1.4;e.style.cssText=`width:${s}rem;height:${s}rem;background:${i%4?'var(--ink)':'var(--wal-l)'}`;$('#deb').append(e);D.push(e)}

const lab=$('#lab'),clk=$('#clk'),tw=$('#tw');
const fmt=v=>{v=Math.round(v);return [v/3600|0,(v%3600)/60|0,v%60].map(p2).join(':')};
const toC=(e,y)=>{const r=e.getBoundingClientRect();return y?innerHeight/2-r.top-r.height/2:innerWidth/2-r.left-r.width/2};
let tl;
window.AUTO={state:'wait',cb:null}; // set by the module: 'home' = already logged in (open home straight after the intro), 'login' = show login
function tick(){const t=tl.time();$('#tc').textContent=`TC 00:00:${p2(Math.floor(t))}:${p2(Math.floor((t%1)*60))}`;$('#bar').style.width=tl.progress()*100+'%'}
function done(){dispatchEvent(new Event('loader:done'))}

// bands cover the screen -> black -> bands leave -> login shows (or home opens if already logged in)
function tail(Y){
  // 8 — glitch stair-step to black
  tl.to('.band',{xPercent:0,duration:.8,stagger:i=>[0,2,4,1,3,5][i]*.09,ease:'power3.inOut'},Y);

  // 9 — brief black, strips leave the opposite way; login boxes show, then texts float up top→bottom
  const cover=Y+.8+.45,go=cover+.02;
  tl.call(()=>{if(AUTO.state!=='wait')return;tl.pause();const tm=setTimeout(()=>{AUTO.state='login';AUTO.cb()},5000);AUTO.cb=()=>{clearTimeout(tm);AUTO.cb=null;tl.play()}},null,cover-.02)
    .set('#login',{visibility:'visible'},cover)
    .call(()=>{if(AUTO.state==='home'&&AUTO.show)AUTO.show()},null,cover+.01)
    .set('#hud',{autoAlpha:0},cover)
    .set('#s2',{visibility:'hidden'},cover)
    .to('.band',{xPercent:i=>i<3?105:-105,duration:.7,stagger:i=>[0,2,4,1,3,5][i]*.07,ease:'power2.inOut'},go)
    .call(()=>{if(AUTO.state==='home'&&AUTO.reveal)AUTO.reveal()},null,go+.15)
    .fromTo('.field,.btn,.gbtn',{y:20,opacity:0},{y:0,opacity:1,duration:.8,ease:'power3.out',stagger:.1,clearProps:'transform'},go+.05)

<script type="text/plain" data-kind="intro" data-order="20">
/* ===== pages/loading/loading-without-login.intro.js ===== */
// ======================================================================
// @@LOADING (without login)
// Full intro animation (agent chips, timer, tagline). Used when nobody is logged in.
// ======================================================================
// [glyph, title, sub, landscape x,y,rot, portrait x,y,rot]  (x,y in rem from screen center)
const CHIPS=[
['‹›','All Ai Agents Pro','Api . OB . 01.00',-30,-16,-5,-18,-17,-5],
['◔','Support Agent','High - 01.00',0,-19,-2,0,-26,-2],
['▤','Dashboard Auto','High - 01.00',30,-16,4,19,-18,4],
['▥','Analysis Agent','Pro . OB',-34,8,4,-19,18,4],
['▣','Security Agent','Max - Go',34,8,-4,19,19,-4],
['◉','Automation','On 0.10 Pro',-20,19,-3,-12,27,-3],
['▦','Payment Pro','Instant-01.00',20,19,5,17,28,5]];

function build(){
  if(isKnown())return buildQuick();
  const u=parseFloat(getComputedStyle(document.documentElement).fontSize),H=innerHeight;
  const P=innerWidth<innerHeight,o=P?6:3;
  CHIPS.forEach(c=>$('#cl').insertAdjacentHTML('beforeend',`<div class="chip" style="left:calc(50% + ${c[o]}rem);top:calc(50% + ${c[o+1]}rem)" data-r="${c[o+2]}"><b>${c[0]}</b><div><strong>${c[1]}</strong><small>${c[2]}</small></div></div>`));
  gsap.set('.arm',{rotation:i=>i*45});
  gsap.set('.chip',{xPercent:-50,yPercent:-50,rotation:(i,e)=>+e.dataset.r});
  gsap.set(D,{xPercent:-50,yPercent:-50});
  gsap.set('#pill',{xPercent:-50});
  gsap.set('#hl',{rotation:-.8});
  gsap.set('.band',{xPercent:i=>i<3?-105:105});
  tl=gsap.timeline({paused:true,onUpdate:tick,onComplete:done});
  tl.timeScale(SPEED);

  // 0 — white page, HUD fades in
  tl.to('#stage',{backgroundColor:'#eef2fb',duration:.6},0)
    .fromTo('#hud',{opacity:0},{opacity:1,duration:1,ease:'power2.out'},1.0)
    .fromTo('.tl,.tr,.top',{y:-1.2*u},{y:0,duration:1.1,ease:'power3.out'},1.0)
    .fromTo('.bl,.br,.bot',{y:1.2*u},{y:0,duration:1.1,ease:'power3.out'},1.0);

  // 1 — lime ball drops, bounces
  tl.fromTo('#ball',{y:-(H/2+3*u)},{y:0,duration:.7,ease:'power2.in'},.25)
    .fromTo('#sh',{opacity:0,scale:.3},{opacity:1,scale:1,duration:.7,ease:'power2.in'},.25)
    .to('#ball',{scaleX:1.35,scaleY:.65,duration:.07},.95)
    .to('#ball',{y:-6*u,scaleX:.92,scaleY:1.08,duration:.3,ease:'power2.out'},1.02)
    .to('#sh',{scale:.55,opacity:.5,duration:.3,ease:'power2.out'},1.02)
    .to('#ball',{y:0,scaleX:1,scaleY:1,duration:.22,ease:'power2.in'},1.32)
    .to('#sh',{scale:1,opacity:1,duration:.22,ease:'power2.in'},1.32);

  // 2 — burst into the shape
  const B=1.54;
  tl.to('#ball',{scale:1.25,duration:.1,yoyo:true,repeat:1},B)
    .to('#sh',{opacity:0,duration:.3},B)
    .set('#r1',{opacity:1,scale:.15},B).to('#r1',{scale:2,opacity:0,duration:1,ease:'power2.out'},B)
    .set('#r2',{opacity:.8,scale:.2},B+.1).to('#r2',{scale:1.15,opacity:0,duration:1.2,ease:'power2.out'},B+.1)
    .fromTo('.b',{scaleX:0},{scaleX:1,duration:.45,stagger:.025,ease:'back.out(1.8)'},B+.08)
    .fromTo('.d',{scale:0,x:-5*u},{scale:1,x:0,duration:.55,stagger:.03,ease:'back.out(2)'},B+.08);
  D.forEach(e=>{const a=Math.random()*6.283,r=(5+Math.random()*10)*u;
    tl.set(e,{opacity:1,x:0,y:0,scale:1},B).to(e,{x:Math.cos(a)*r,y:Math.sin(a)*r,scale:.3,opacity:0,duration:1+Math.random()*.5,ease:'power3.out'},B)});
  const msg='> All Ultimate Servers - Online',T={n:0};
  tl.set('#tw',{opacity:1},B+.5).to(T,{n:msg.length,duration:.9,ease:'none',onUpdate:()=>{tw.textContent=msg.slice(0,Math.round(T.n))+'▌'}},B+.5);

  // 3 — spin with orbit, then collapse
  tl.to('#g',{rotation:180,duration:.95,ease:'power3.inOut'},2.15)
    .to('#g',{filter:'blur(2.5px)',duration:.25,yoyo:true,repeat:1},2.3)
    .set('#orb',{opacity:1,scale:.6,rotation:-30},2.15).to('#orb',{scale:1,rotation:-16,duration:.5,ease:'power2.out'},2.15).to('#orb',{opacity:0,duration:.3},2.8)
    .to('#tw',{opacity:0,duration:.2},3.2)
    .to('.d',{x:-3.2*u,scale:.55,duration:.35,ease:'power2.in'},3.3)
    .to('#g',{scale:.6,filter:'blur(1.5px)',duration:.35,ease:'power2.in'},3.3);

  // 4 — lime flood, cream circle opens
  tl.to('#flood',{clipPath:'circle(75% at 50% 50%)',duration:.4,ease:'power3.in'},3.65)
    .set('#s1',{visibility:'hidden'},4.05)
    
    .to('#hole',{clipPath:'circle(75% at 50% 50%)',duration:.55,ease:'power3.out'},4.05)
    .set('#s2',{visibility:'visible'},4.05);

  // 5 — "Deadline", timer, highlight, chips
  const C={v:10*3600};clk.textContent=fmt(C.v);
  tl.fromTo('.l',{yPercent:115,rotation:7,skewX:-10,opacity:0},{yPercent:0,rotation:0,skewX:0,opacity:1,duration:.75,stagger:.04,ease:'power3.out'},4.25)
    .fromTo('#pill',{opacity:0,scale:.6},{opacity:1,scale:1,duration:.5,ease:'back.out(2)'},4.75)
    .to(C,{v:0,duration:1.4,ease:'power2.out',onUpdate:()=>{clk.textContent=fmt(C.v)}},4.85)
    .to('#clk',{color:'#7b99f6',duration:.2},6.25).to('#pdot',{backgroundColor:'#7b99f6',duration:.2},6.25)
    .fromTo('#hl',{scaleX:0},{scaleX:1,duration:.5,ease:'power3.inOut'},5.4)
    .fromTo('.chip',{opacity:0,scale:.5,y:3*u},{opacity:1,scale:1,y:0,duration:.5,stagger:.08,ease:'back.out(1.8)'},5.5);

  // 6 — everything whirls into the center and out
  const X=6.9;
  tl.to('.chip',{x:(i,e)=>toC(e,0),y:(i,e)=>toC(e,1),scale:.3,opacity:0,filter:'blur(6px)',duration:.5,stagger:.03,ease:'power3.in'},X)
    .to('.l',{yPercent:-120,skewX:8,opacity:0,filter:'blur(6px)',duration:.4,stagger:.015,ease:'power3.in'},X+.1)
    .to('#pill,#hl',{opacity:0,scale:.7,duration:.3},X+.05)
    .set('#t2',{visibility:'visible'},X+.45)
    .set('#s2',{visibility:'hidden'},X+.7);

  // 7 — tagline
  const Y=X+.5;
  tl.fromTo('#a1',{yPercent:110},{yPercent:0,duration:.6,ease:'power4.out'},Y)
    .fromTo('#a2',{yPercent:110},{yPercent:0,duration:.6,ease:'power4.out'},Y+.12)
    .to('#mk',{backgroundSize:'100% 60%',duration:.5,ease:'power3.inOut'},Y+.5);

  tail(Y+1.7);
}
</script>
<script type="text/plain" data-kind="intro" data-order="30">
/* ===== pages/loading/loading-with-login.intro.js ===== */
// ======================================================================
// @@LOADING (with login)
// Short intro for an already logged-in user: only the "Ultimate Tour" word, then the strips open straight into Home.
// ======================================================================
// ---- Already logged in (flag 'ut_in' saved by app.js): short intro = only the "Ultimate Tour" word floats in the center, then the black strips take over and open straight into home ----
function isKnown(){try{const s=new URLSearchParams(location.search);return localStorage.getItem('ut_in')==='1'&&AUTO.state!=='login'&&sessionStorage.getItem('ut_g')!=='1'&&!s.get('verified')&&!s.get('reset')&&!s.has('oobCode')}catch(e){return false}}
function buildQuick(){

  tl.fromTo('.l',{yPercent:115,rotation:7,skewX:-10,opacity:0},{yPercent:0,rotation:0,skewX:0,opacity:1,duration:.75,stagger:.04,ease:'power3.out'},.2)
    .fromTo('#hl',{scaleX:0},{scaleX:1,duration:.5,ease:'power3.inOut'},.9);

}

<script type="text/plain" data-kind="app" data-order="90">
/* ===== pages/login/login.js ===== */
// ======================================================================
// @@PAGE-LOGIN   Login page: email + password button
//   HTML: <!-- @@LOGIN -->  CSS: /* @@LOGIN */
// ======================================================================
// Email + password login (text gathers into a ball > spinner > tick > box expands to home or the verify page)
q('#login .btn').onclick=e=>{const b=e.currentTarget;return run(b,lgF,async()=>{
  const em=lgF.username.value.trim(),pw=lgF.password.value;
  if(!em)throw{code:'app/email-empty'};
  if(!MAIL.test(em))throw{code:'auth/invalid-email'};
  await animRun(b,async()=>{
    const m=await fetchSignInMethodsForEmail(auth,em).catch(()=>[]);
    if(m.includes('google.com')&&!m.includes('password'))throw{code:'app/use-google'};
    if(!pw)throw{code:'app/pw-empty'};
    const {user}=await signInWithEmailAndPassword(auth,em,pw);
    if(!user.emailVerified)return user;
    return await getProfile(user)||await makeProfile(user)})},false)};


</script>

async function finishGoogle(btn,user){const g=gAnim(btn);try{await g.eat();const p=await getProfile(user)||await autoProfile(user);await g.done();await g.expand();enter(p);g.fade()}catch(e){g.reset();throw e}}
const google=btn=>run(btn,sgOn()?sgF:lgF,async()=>{
  const gp=new GoogleAuthProvider();gp.setCustomParameters({prompt:'select_account'});
  try{sessionStorage.setItem('ut_g','1')}catch(x){}
  let user;try{({user}=await signInWithPopup(auth,gp))}finally{try{sessionStorage.removeItem('ut_g')}catch(x){}}
  await finishGoogle(btn,user)},false);
document.querySelectorAll('.gbtn').forEach(b=>b.onclick=()=>google(b));


</script>

    gsap.set(ub,{x:SX+(EX-SX)*k+Math.cos(a)*A,y:SY+(EY-SY)*k+Math.sin(a)*A})}},.6);

   .to(xc,{scale:1,duration:.55,ease:'power3.inOut'},T0+.5)
   .set(su,{backgroundColor:'#eef2fb'},T0+1.05);
  // 6 boxes rise first, then texts float top to bottom
  const E=T0+.9;
  t.to('#signup .field,#signup .btn,#signup .gbtn',{y:0,opacity:1,duration:.8,ease:'power3.out',stagger:.1,clearProps:'transform'},E)
   .to('#signup .st',{y:0,opacity:1,duration:.7,ease:'power3.out',stagger:(i,el)=>el.dataset.g*.14},E+.8);
}
function goLogin(btn){
  if(busy)return;busy=true;SH(1);
  document.activeElement&&document.activeElement.blur();
  const r=btn.getBoundingClientRect(),W=innerWidth,H=innerHeight,SX=r.left+r.width/2,SY=r.bottom-1,EX=W/2,EY=H/2;
  const ub=$('#ub'),xf=$('#xf'),xc=$('#xc'),fx=$('#fx'),su=$('#signup'),lg=$('#login'),P={k:0};

  for(const e of [xf,xc]){gsap.set(e,{width:RM*2,height:RM*2,marginLeft:-RM,marginTop:-RM,scale:0,visibility:'visible',force3D:true})}
  gsap.set(btn,{borderBottomColor:'transparent',display:'inline-block',transformOrigin:'50% 100%'});
  const mk=(css)=>{const i=document.createElement('i');i.style.cssText=css;fx.appendChild(i);return i};
  const rings=[0,1].map(n=>mk('width:400px;height:400px;margin:-200px 0 0 -200px;border:4px solid '+(n?'#0f1730':'#7b99f6')+';opacity:0'));
  const dots=Array.from({length:16},(_,n)=>{const s=n%3===0?16:n%3===1?10:7;return mk('width:'+s+'px;height:'+s+'px;margin:-'+s/2+'px 0 0 -'+s/2+'px;background:'+(n%4===0?'#0f1730':'#7b99f6')+';opacity:0')});
  gsap.set([...rings,...dots],{x:0,y:0,scale:0,force3D:true});
  const cleanup=()=>{fx.innerHTML='';for(const e of [xf,xc])gsap.set(e,{clearProps:'all'});gsap.set(ub,{visibility:'hidden',clearProps:'boxShadow'});gsap.set(lg,{clearProps:'zIndex,backgroundColor'});gsap.set(su,{clearProps:'zIndex,backgroundColor'});busy=false;SH(0)};
  const t=gsap.timeline({defaults:{overwrite:false},onComplete:cleanup});
  // 1 text sucked into the underline, line rolls up into a ball
  t.set(ub,{backgroundImage:'radial-gradient(circle at 35% 30%,#cdd8ff,#7b99f6 55%,#5f80f2)'},0)
   .to(btn,{scale:.04,y:r.height*.35,opacity:0,duration:.6,ease:'power2.inOut'},0)
   .to(ub,{width:30,height:30,borderRadius:15,duration:.6,ease:'power2.inOut'},0);
  // 2 smooth arc to the exact center (no spin): ball hops up and glides in, softly settling
  t.to(P,{k:1,duration:T0-.6,ease:'power3.inOut',onUpdate:()=>{const k=P.k,lift=H*.14*Math.sin(Math.PI*k);
    gsap.set(ub,{x:SX+(EX-SX)*k,y:SY+(EY-SY)*k-lift,scale:1+.25*Math.sin(Math.PI*k)})}},.6);
  // 3 burst
  t.to(ub,{scale:.7,duration:.16,ease:'power2.in'},T0-.02)
   .to(ub,{scale:2.6,opacity:0,duration:.34,ease:'expo.out'},T0+.14)
   .to(rings[0],{scale:1.7,duration:.35,ease:'expo.out'},T0+.14)
   .fromTo(rings[0],{opacity:.9},{opacity:0,duration:.4,ease:'power2.out'},T0+.14)
   .to(rings[1],{scale:1.15,duration:.35,ease:'expo.out'},T0+.18)
   .fromTo(rings[1],{opacity:.55},{opacity:0,duration:.4,ease:'power2.out'},T0+.18);
  dots.forEach((d,n)=>{const a=n/dots.length*Math.PI*2+(n%2?.18:0),dist=(n%2?170:290)+(n%3)*50;
    t.set(d,{opacity:1},T0+.14)
     .to(d,{x:Math.cos(a)*dist,y:Math.sin(a)*dist,scale:1,duration:.35,ease:'expo.out'},T0+.14)
     .to(d,{scale:0,opacity:0,duration:.15,ease:'power1.in'},T0+.22)});
  // 4 signup elements blast outward
  sk().forEach((el,i)=>{el.style.transition='none';el.style.willChange='transform,opacity';const b=el.getBoundingClientRect(),dx=b.left+b.width/2-EX,dy=b.top+b.height/2-EY,d=Math.hypot(dx,dy)||1;
    t.to(el,{x:dx/d*W*.45,y:dy/d*H*.45,scale:.6,opacity:0,duration:.4,ease:'power3.in',force3D:true},T0+.12+.015*i)});
  // 5 lime wave, then cream wave opens the login page
  t.to(xf,{scale:1,duration:.6,ease:'power3.inOut'},T0+.1)
   .add(()=>{su.style.visibility='hidden';gsap.set(btn,{clearProps:'all'});sk().forEach(el=>{el.style.transition='';el.style.willChange='';gsap.set(el,{clearProps:'transform,opacity,filter'})});gsap.set('#signup .st',{opacity:0});lg.style.visibility='visible'},T0+.7)
   .to(xc,{scale:1,duration:.55,ease:'power3.inOut'},T0+.5)

<script type="text/plain" data-kind="app" data-order="110">
/* ===== pages/signup/signup.js ===== */
// ======================================================================
// @@PAGE-CREATE   Create account page: field-by-field checks, then verification email
//   HTML: <!-- @@SIGNUP -->
// ======================================================================
// Create account: makes the login, emails a verification link, and shows the verify page. Profile is saved only after verification.
q('#sgf .btn').onclick=e=>{const b=e.currentTarget;if(!cdReady(b)){shake(b.querySelector('span'));return}return run(b,sgF,async()=>{
  const name=v('name'),un=v('username').toLowerCase(),em=v('email'),ph=v('phone'),p1=q('#su_pw1').value,p2=q('#su_pw2').value;
  await animRun(b,async()=>{
    if(!name)throw{code:'app/name-empty'};
    if(!NAME.test(name))throw{code:'app/name'};
    if(!un)throw{code:'app/username-empty'};
    if(!/^[a-z0-9_.]{3,20}$/.test(un))throw{code:'app/username'};
    if((await getDoc(doc(db,'usernames',un))).exists())throw{code:'app/username-taken'};
    if(!em)throw{code:'app/email-empty'};
    if(!MAIL.test(em))throw{code:'auth/invalid-email'};
    if((await fetchSignInMethodsForEmail(auth,em).catch(()=>[])).length)throw{code:'auth/email-already-in-use'};
    if(ph&&!/^\+?[0-9\s-]{7,15}$/.test(ph))throw{code:'app/phone'};
    if(!p1)throw{code:'app/pw-new-empty'};
    if(p1.length<6)throw{code:'auth/weak-password'};
    if(!p2)throw{code:'app/pw2-empty'};
    if(p1!==p2)throw{code:'app/pw-match'};
    const {user}=await createUserWithEmailAndPassword(auth,em,p1);
    mailP=sendEmailVerification(user);mailP.catch(()=>{});
    try{localStorage.setItem(PK,JSON.stringify({name,username:un,email:em.toLowerCase(),phone:ph}))}catch(e){}
    return user})},false)};


</script>
<script type="text/plain" data-kind="app" data-order="120">
/* ===== pages/verify/verify.js ===== */
// ======================================================================
// @@PAGE-VERIFY   Check your Gmail page (after Create): timers, Confirm, Resend, Use another email
//   HTML: <!-- @@VERIFY -->
// ======================================================================
const ver=q('#verify'),vF=q('#verify .lg'),PK='ut_pending';let mailP=null;
const COOL=80;
const mkTimer=sel=>{let at=0,id=null;const el=()=>q(sel);
  return{start(sec){clearInterval(id);at=Date.now()+sec*1000;const t=()=>{const n=Math.ceil((at-Date.now())/1000);if(n>0)el().textContent=n+'s';else{el().textContent='';clearInterval(id)}};t();id=setInterval(t,250)},
    ready:()=>Date.now()>=at,block(){clearInterval(id);at=Infinity;el().textContent=''},reset(){clearInterval(id);at=0;el().textContent=''}}};
const T1=mkTimer('#v_t'),T2=mkTimer('#rs_t');
const showVerify=u=>{
  q('#v_mail').textContent=u.email;ver.style.display='flex';
  const p=mailP,ok=q('#v_ok'),st=q('#v_st'),READY='Open the link we sent to your inbox (check Spam too), then come back here and tap Confirm.';
  mailP=null;
  if(!p){st.textContent=READY;ok.style.display='';return}
  ok.style.display='none';T1.block();st.textContent='Sending the link to your Gmail...';
  p.then(()=>{st.textContent=READY;T1.start(COOL)},()=>{st.textContent='Could not send the link automatically. Tap Resend link.';T1.reset()})
   .then(()=>{ok.style.display='';gsap.killTweensOf(ok);gsap.fromTo(ok,{y:16,opacity:0},{y:0,opacity:1,duration:.5,ease:'power3.out'})})};
const shake=b=>gsap.timeline().to(b,{x:-8,duration:.05}).to(b,{x:8,duration:.07}).to(b,{x:-6,duration:.07}).to(b,{x:6,duration:.07}).to(b,{x:0,duration:.05});
// Verify page: Confirm, Resend, Use another email
q('#v_ok').onclick=e=>{const b=e.currentTarget;return run(b,vF,async()=>{
  const u=auth.currentUser;if(!u)throw{code:'app/no-profile'};
  await u.reload();if(!u.emailVerified)throw{code:'app/not-verified'};
  await animRun(b,async()=>await getProfile(u)||await makeProfile(u),enter)},false)};
q('#v_re').onclick=e=>{const b=e.currentTarget;if(b.dataset.busy)return;
  if(!T1.ready()){shake(b);return}
  b.dataset.busy=1;
  lineAnim(b,sendEmailVerification(auth.currentUser)).then(()=>{say(vF,'Link sent again. Check Gmail and Spam',1);T1.start(COOL)},err=>{say(vF,E[err.code]||'Could not send the link. Try again later');if(err.code==='auth/too-many-requests')T1.start(COOL)}).finally(()=>{delete b.dataset.busy})};
q('#v_x').onclick=e=>{const b=e.currentTarget;if(b.dataset.busy)return;const u=auth.currentUser;
  const job=(async()=>{try{if(u&&!u.emailVerified)await deleteUser(u)}catch(err){}await signOut(auth).catch(()=>{});try{localStorage.removeItem(PK)}catch(err){}})();
  if(!sgOn()){job.then(()=>location.reload());return}
  b.dataset.busy=1;T1.reset();
  lineAnim(b,job,()=>{ver.style.display='none';const m=q('#su_email');m.value='';m.readOnly=false;say(sgF,'')}).then(()=>btnWrite(q('#sgf .btn'),'Create',COOL)).finally(()=>{delete b.dataset.busy})};


</script>

<script type="text/plain" data-kind="app" data-order="130">
/* ===== pages/reset/reset.js ===== */
// ======================================================================
// @@PAGE-RESET   Forgot password pages: email page, Check your Gmail page
//   HTML: <!-- @@RESET -->

<script type="text/plain" data-kind="app" data-order="140">
/* ===== pages/home/home.js ===== */
// ======================================================================
// @@PAGE-HOME   Home page: tabs (Home, Tours, Results, Profile), glass nav bar with sliding ball, toast
//   HTML: <!-- @@HOME -->  CSS: /* @@HOME */  Filled by enter() in @@DATA.
// ======================================================================
// Tab switch: pages sit side by side like a carousel. Right tab = old page leaves LEFT, new page arrives from RIGHT; left tab = reverse.
// Every tap goes into a queue and the pages change ONE BY ONE (faster when many are waiting), so animations never overlap.
// If 10 taps are waiting (spam): finish the next page, stop, go Home, then the red "stop" animation plays and input is locked.
let cur=0;const SLIDE={d:.38,e:'power3.out'},LIM=10;
const PG=[...document.querySelectorAll('.hm-pg')],X=PG.map(()=>0),TW=PG.map(()=>null),DONE=PG.map(()=>null);
const put=(i,x)=>{X[i]=x;PG[i].style.transform='translate3d('+x+'%,0,0)'};
const hideP=i=>{if(TW[i])TW[i].kill();TW[i]=null;if(DONE[i]){DONE[i]();DONE[i]=null}PG[i].classList.remove('on');X[i]=0;PG[i].style.transform=''};
function move(i,to,dur){return new Promise(res=>{if(TW[i])TW[i].kill();if(DONE[i])DONE[i]();DONE[i]=res;const o={x:X[i]};
  TW[i]=gsap.to(o,{x:to,duration:dur,ease:SLIDE.e,onUpdate:()=>put(i,o.x),
    onComplete:()=>{TW[i]=null;DONE[i]=null;if(i===cur){X[i]=0;PG[i].style.transform=''}else hideP(i);res()}})})}
function ballTo(n,d){const items=[...document.querySelectorAll('#nav .nv')],nb=q('#navball'),bt=items[n];
  items.forEach((b,i)=>b.classList.toggle('on',i===n));
  nb.style.transitionDuration=d?d+'s':'';nb.style.left=(bt.offsetLeft+2)+'px';nb.style.width=(bt.offsetWidth-4)+'px'}
function showTab(n,instant,d){
  d=d||SLIDE.d;if(instant)ballTo(n,0);
  if(instant){PG.forEach((p,i)=>{hideP(i);if(i===n)p.classList.add('on')});cur=n;Q.length=0;return Promise.resolve()}
  const old=cur,dir=n>old?1:n<old?-1:0;cur=n;
  let parked=false;
  if(!PG[n].classList.contains('on')){PG[n].classList.add('on');put(n,(dir||1)*100);parked=true}
  const jobs=[[n,0]];
  PG.forEach((p,i)=>{if(i===n||!p.classList.contains('on'))return;
    const side=i===old?-dir:(X[i]<0?-1:1);
    if(parked&&i!==old&&side===dir){hideP(i);return}
    jobs.push([i,side*100])});
  const far=Math.max(...jobs.map(([i,t])=>Math.abs(t-X[i]))),dur=d*(.4+.6*Math.min(1,far/100));
  return Promise.all(jobs.map(([i,t])=>move(i,t,dur)))}

// ---- tap queue
const Q=[];let running=false,locked=false;
const lastTarget=()=>Q.length?Q[Q.length-1]:cur;
async function pump(){if(running)return;running=true;q('#home').classList.add('busy');
  while(Q.length){const n=Q.shift(),pend=Q.length;await showTab(n,false,pend>2?.2:pend>0?.28:SLIDE.d)}
  running=false;if(locked)await penalty();
  if(!running&&!Q.length)q('#home').classList.remove('busy')}
function go(i){if(locked||i===lastTarget())return;
  ballTo(i,.4);   // green ball goes to the tapped icon right away (it can change its mind mid-way)
  Q.push(i);
  if(Q.length>=LIM){locked=true;Q.splice(1);ballTo(Q[0],.4)}   // too many: keep only the very next page, then stop
  pump()}
document.querySelectorAll('#nav .nv').forEach((b,i)=>b.onclick=()=>{if(locked)return;try{navigator.vibrate&&navigator.vibrate(8)}catch(x){}go(i)});

// ---- "stop spamming" animation
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const tw=(el,v)=>new Promise(r=>gsap.to(el,{...v,onComplete:r}));
async function penalty(){
  const nav=q('#nav'),nb=q('#navball'),H=q('#home'),S=q('#jamsc');let card=null;
  const ease='power3.inOut';
  try{
    if(cur!==0){ballTo(0,.45);await showTab(0,false,.4)}
    await wait(150);
    // 1) green ball -> middle of the nav bar, turns red
    document.querySelectorAll('#nav .nv').forEach(b=>b.classList.remove('on'));
    nb.style.transitionDuration='.6s';nb.style.left=((nav.clientWidth-nb.offsetWidth)/2)+'px';nb.classList.add('red');
    await wait(750);
    // 2) the nav bar (with the red ball in it) is swapped for an identical card that carries it to the middle of the screen
    const hr=H.getBoundingClientRect(),nr=nav.getBoundingClientRect(),br=nb.getBoundingClientRect();
    const rel={left:br.left-nr.left-1,top:br.top-nr.top-1,width:br.width,height:br.height};
    const w=Math.min(320,hr.width-40),h=224,D=62,cx=hr.width/2,cy=hr.height/2-10;
    card=document.createElement('div');card.id='jam';
    card.innerHTML='<div id="jamball"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg></div><div id="jamin"></div><p id="jamtx"><b>Hey, what\'s going on?</b><span>Why all the rapid taps? Did something go wrong? Tell me and I\'ll help you out.</span></p>';
    const ball=card.querySelector('#jamball'),I=card.querySelector('svg'),T=card.querySelector('#jamtx'),IN=card.querySelector('#jamin');
    nav.querySelectorAll('.nv').forEach(b=>IN.appendChild(b.cloneNode(true)));
    H.appendChild(card);
    gsap.set(card,{left:nr.left-hr.left,top:nr.top-hr.top,width:nr.width,height:nr.height});
    gsap.set(ball,rel);
    T.style.top=(26+D+14)+'px';T.style.width=(w-42)+'px';
    nav.style.visibility='hidden';
    S.style.display='block';gsap.to(S,{opacity:1,duration:.6});
    // 3) in ONE smooth motion: the bar grows into the card while flying to the middle, the red ball becomes the "no" sign
    await Promise.all([
      tw(IN,{opacity:0,duration:.35,ease:'power1.out'}),
      tw(card,{left:cx-w/2,top:cy-h/2,width:w,height:h,borderRadius:30,duration:1,ease}),
      tw(ball,{left:(w-2-D)/2,top:26,width:D,height:D,borderRadius:D/2,duration:1,ease})]);
    gsap.fromTo(I,{opacity:0,scale:.5},{opacity:1,scale:1,duration:.5,ease:'back.out(2)'});
    gsap.fromTo(T,{opacity:0,y:10},{opacity:1,y:0,duration:.6,delay:.15});
    await wait(3200);
    // 4) content fades, then card shrinks straight back into the nav bar (sign -> red ball) in one motion
    gsap.to([T,I],{opacity:0,duration:.3});gsap.to(S,{opacity:0,duration:.7,delay:.2});
    await wait(250);
    await Promise.all([
      tw(IN,{opacity:1,duration:.4,delay:.6,ease:'power1.in'}),
      tw(card,{left:nr.left-hr.left,top:nr.top-hr.top,width:nr.width,height:nr.height,borderRadius:32,duration:1,ease}),
      tw(ball,{...rel,borderRadius:26,duration:1,ease})]);
    nav.style.visibility='';card.remove();card=null;S.style.display='none';
    // 5) back to Home, ball green again
    nb.classList.remove('red');ballTo(0,.6);
    await wait(700);
  }finally{
    if(card)card.remove();nav.style.visibility='';S.style.display='none';nb.classList.remove('red');ballTo(cur,.4);
    Q.length=0;locked=false}}

// drag left/right on the home area: next page follows the finger, then settles (or snaps back).
// Swiping while pages are still changing just adds to the queue.
{const H=q('#home');let sx=0,sy=0,st=0,lock='',side=0,W=1;
 H.addEventListener('touchstart',e=>{const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now();side=0;W=H.clientWidth||1;
  lock=(locked||e.target.closest('#nav,#wlpg'))?'no':(running||Q.length)?'anim':''},{passive:true});
 H.addEventListener('touchmove',e=>{if(lock==='no'||lock==='anim')return;const t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;

.pf-bi{position:relative;width:22px;height:22px}.pf-bi svg{position:absolute;left:0;top:0;width:22px;height:22px}.pf-ba{visibility:hidden}
.pf-ar{position:absolute;left:0;top:0;width:22px;height:22px;z-index:8;pointer-events:none;visibility:hidden;fill:none;stroke:#fff;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;filter:drop-shadow(0 0 1px #0f1730) drop-shadow(0 0 1px #0f1730)}

.pfp-bd{position:fixed;inset:0;z-index:99998;background:rgba(30,41,100,.5);opacity:0;touch-action:none;-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px)}
.pfp{position:fixed;z-index:99999;box-sizing:border-box;overflow:hidden;background:#141b45;color:#fff;touch-action:none;box-shadow:0 24px 60px rgba(15,23,70,.5)}

.pfp-c{padding:78px 20px 20px;display:grid;gap:14px;text-align:center}

.pfp-ok{all:unset;box-sizing:border-box;position:relative;display:flex;align-items:center;justify-content:center;height:54px;border-radius:99px;background:#9db4ff;color:#0f1730;font:700 14px var(--mono);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent}

/* pop-up v2: Confirm button (pen writes its label), pen that lives above the pop-up */
.pfp-ok{background:#1d2760;color:#9db4ff;border:1.5px solid rgba(157,180,255,.55);gap:12px}

.pfp-pn{position:fixed;left:0;top:0;width:22px;height:22px;z-index:100000;pointer-events:none;color:#9db4ff}
/* lock look + bypass code box */
.pf-row{transition:box-shadow .4s,background .5s}

.pf-row small{white-space:nowrap}.pf-n{flex:0 1 auto}
.ic b svg{display:block;width:24px;height:24px}
.pfp-cd{display:grid;gap:6px;text-align:left}.pfp-cd small{font:700 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#9db4ff}

<script type="text/plain" data-kind="app" data-order="180">
/* ===== pages/profile/profile.js ===== */
// ======================================================================
// @@PAGE-PROFILE   Profile tab: info card, pen icon > edit mode > Update. A changed (already filled) detail locks for 24h.
//   HTML: <!-- @@PROFILE -->  CSS: /* @@PROFILE */  Filled by fillPf() (called from enter() in @@DATA).
//   Email is shown but cannot be edited. Empty details can be added any time (no lock); lock starts only when a filled detail is changed.
// ======================================================================
const DAY=864e5,pf=q('#pf'),pfAct=q('#pf_act'),PF=[['name','Aa','Full Name'],['username','@','Username'],['phone','#','Phone Number']];
Object.assign(E,{'app/pf-same':'Nothing changed yet','app/pf-locked':'This detail was changed recently. Try again later'});
let ME=null;
const lockAt=(p,k)=>{const t=p.locks&&p.locks[k];return t?(t.toMillis?t.toMillis():+t):0};
const PF_SHOW_PHONE=false;   // the floating phone / 'Verify your number' line on the small card is hidden for now
const LOCK_ON=true;   // 24h lock: a filled name/username/phone can be changed once, then it is locked for 24h (set false to switch off)
const lockLeft=(p,k)=>LOCK_ON&&p[k]?lockAt(p,k)+DAY-Date.now():0;
q('#pf_rows').innerHTML=''+PF.map(([k,ic,lb])=>`<label class="pf-row${k==='email'?' ro':''}" data-k="${k}" data-g="${ic}"><i class="ic"><b>${ic}</b></i><span class="tx"><small>${lb}<em class="pf-n"></em></small><b class="pf-v"></b>${k==='email'?'':`<input class="pf-in" type="${k==='phone'?'tel':'text'}" autocapitalize="none" spellcheck="false" placeholder="${k==='phone'?'Not uploaded yet':''}" autocomplete="off">`}</span></label>`).join('');
function fillPf(p){ME=p;const u=p.username||'player';
  q('#hm_user').textContent=u;q('#hm_av').textContent=q('#pf_av').textContent=u[0].toUpperCase();
  pf.querySelectorAll('.pf-row').forEach(r=>r.querySelector('.pf-v').textContent=p[r.dataset.k]||'');
  q('#pf_nm').textContent=p.name||'';q('#pf_em').textContent=p.email||'';q('#pf_unt').textContent='@'+u;
  const ph=q('#pf_ph');ph.hidden=!(PF_SHOW_PHONE&&p.phone);ph.classList.toggle('ok',!!p.phoneVerified);ph.querySelector('b').textContent=p.phone||'';ph.querySelector('span').textContent=p.phoneVerified?'Verified number':'Verify your number'}
// tap the @username to copy it
q('#pf_un').onclick=async()=>{const t=q('#pf_un').textContent;try{await navigator.clipboard.writeText(t)}catch(e){const a=document.createElement('textarea');a.value=t;a.style.cssText='position:fixed;opacity:0';document.body.append(a);a.select();try{document.execCommand('copy')}catch(x){}a.remove()}toast('Username copied')};
// ---- lock look of the edit rows: live countdown, lock/unlock animation (padlock flips in, shackle snaps shut), secret 10s hold = bypass
const PF_BYPASS='109283',PF_LOCK='<svg viewBox="0 0 24 24" fill="none"><rect x="5" y="11" width="14" height="10" rx="2.5" fill="currentColor" stroke="none"/><path class="sh" d="M8 11V8a4 4 0 0 1 8 0v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>';
const pfFmt=ms=>{const s=Math.max(0,Math.ceil(ms/1000)),h=Math.floor(s/3600),m=Math.floor(s%3600/60);return(h?h+'h ':'')+(h||m?m+'m ':'')+s%60+'s'};
function pfRowLock(r,lock,anim){
  if(!!r._lk===lock)return;r._lk=lock;const ic=r.querySelector('.ic b'),g=r.dataset.g;
  if(!anim){r.classList.toggle('lk',lock);ic.innerHTML=lock?PF_LOCK:g;gsap.set(ic,{scaleX:1});return}
  const tl=gsap.timeline();
  if(lock)tl.to(r,{scale:.97,duration:.12,ease:'power2.in'},0).add(()=>r.classList.add('lk'),0)      // greys out smoothly (css), box dips
    .to(ic,{scaleX:0,duration:.15,ease:'power1.in'},0).add(()=>{ic.innerHTML=PF_LOCK;gsap.set(ic.querySelector('.sh'),{y:-4,rotation:-14,svgOrigin:'16 11'})},.15)
    .to(ic,{scaleX:1,duration:.2,ease:'back.out(2)'},.15).to(r,{scale:1,duration:.7,ease:'elastic.out(1,.4)'},.3)
    .add(()=>gsap.to(ic.querySelector('.sh'),{y:0,rotation:0,duration:.4,ease:'bounce.out'}),.38);          // shackle snaps shut
  else{const sh=ic.querySelector('.sh');                                                                       // exact reverse
    tl.add(()=>sh&&gsap.to(sh,{y:-4,rotation:-14,duration:.3,ease:'back.out(2)'}),0).add(()=>r.classList.remove('lk'),.3)
      .to(r,{scale:1.03,duration:.15,yoyo:true,repeat:1},.3).to(ic,{scaleX:0,duration:.15,ease:'power1.in'},.3)
      .add(()=>{ic.innerHTML=g},.45).to(ic,{scaleX:1,duration:.2,ease:'back.out(2)'},.45)}}
// fill=true puts the saved values into the boxes; anim=true animates a lock/unlock change
function pfLockUI(fill,anim){pf.querySelectorAll('.pf-row').forEach(r=>{const k=r.dataset.k,i=r.querySelector('input'),n=r.querySelector('.pf-n');
  const L=k==='email'?0:lockLeft(ME,k),lk=L>0&&!pfBypass[k];
  pfRowLock(r,lk,anim);if(i){if(fill)i.value=ME[k]||'';i.disabled=lk}
  n.textContent=k==='email'?"Can't be changed":lk?'Locked for '+pfFmt(L):''})}
function pfMode(on){pfUpdReset();if(on)pfLockUI(true)}
setInterval(()=>{if(ME&&pf.classList.contains('ed'))pfLockUI(false,!pfBusy)},1000);   // the countdown ticks every second; a lock that ran out opens by itself
// secret: hold a locked name / username box for 10 seconds = unlock it (the pop-up will then ask for the bypass code)
let pfHold=null,pfHx=0,pfHy=0;const pfRows=q('#pf_rows');
pfRows.addEventListener('pointerdown',e=>{const r=e.target.closest('.pf-row');if(!r||pfBusy||!r.classList.contains('lk'))return;const k=r.dataset.k;if(k!=='name'&&k!=='username')return;

      pfBypass={};ME.locks=res.locks;pfLockUI(false,true);
      if(pfShown){await pfPenTo(pfRub(pfWT),135,.45);await pfSweep(pfWT,'erase',.32);pfWT.textContent='';pfShown=''}
      if('name' in ch||'username' in ch){pfHm.classList.add('noscroll');await pfToTop()}   // page glides to the top, no scrolling until done
      if('name' in ch)await pfRewrite(pfNM,pfNM,res.name);
      if('username' in ch)await pfRewrite(pfUN,pfUNT,'@'+res.username)}
    // 4) pen writes "Update" back and goes home
    await pfPenTo(pfTip(pfUT),0,.45);await pfSweep(pfUT,'write',.4);await pfHome();
    if(res){fillPf(res);pfBypass={};pfLockUI(true);toast('Profile updated');pfNC=0;pfHm.classList.remove('noscroll');pfLock(false);return}   // the card stays open
    if(!err&&same&&pfNC>=5){pfHm.classList.add('noscroll');await pfToTop();await pfShoot();pfLock(false);pfToggle(false);return}
  }catch(e){console.error(e);pfUpdReset();pfHm.classList.remove('noscroll')}
  pfHm.classList.remove('noscroll');pfLock(false)};


</script>

<script type="text/plain" data-kind="app" data-order="150">
/* ===== pages/wallet/wallet.js ===== */
// ======================================================================
// @@PAGE-WALLET   Wallet page: tap the home wallet card (not its buttons) > the card itself grows to the whole screen, its colour fades from
//   black to the app's cream, then the page items float up one by one. The back arrow plays it in reverse (page shrinks back into the card).
//   Transactions are read from Firestore: users/{uid}/transactions  { type:'add'|'withdraw', amount:number, createdAt:Timestamp, method?:string, status?:string }
//   HTML: <!-- @@WALLET -->  CSS: /* @@WALLET */
// ======================================================================
{const H=q('#home'),W=q('#wlpg'),bg=q('#wl_bg'),gl=q('#wl_gl'),card=q('#hm0 .wallet'),sc=q('#wl_sc'),list=q('#wl_list');
let wlBusy=false,wlOpen=false,wlFirst=true,wlUid='',gh=null,SH='',SH0='',adState=0,adReset=()=>{};   // adState: 0 closed, 1 animating, 2 pop-up open (see @@WALLET-ADDMONEY)
const DUR=.8,EASE='power3.inOut',INK='#4f74f4',CREAM='#eef2fb',wlMoney=n=>'BDT '+Number(n||0).toLocaleString('en-US',{minimumFractionDigits:2});
const kids=()=>[...sc.children];   // header, card, buttons, heading, list: they float up one by one
const geo=()=>{const h=H.getBoundingClientRect(),c=card.getBoundingClientRect();return{c,t:c.top-h.top,l:c.left-h.left,r:h.right-c.right,b:h.bottom-c.bottom}};
const clean=()=>{gsap.set([bg,gl,...kids()],{clearProps:'all'});if(gh){gh.remove();gh=null}};
function ghost(c){   // a look-alike of the home card (text + glow) that sits inside the sheet, so the card seems to be the thing that grows
  gh=card.cloneNode(true);gh.removeAttribute('id');gh.querySelectorAll('[id]').forEach(e=>e.removeAttribute('id'));gh.querySelectorAll('[data-toast]').forEach(e=>e.removeAttribute('data-toast'));
  gh.classList.add('wl-gh');gh.style.width=c.width+'px';gh.style.height=c.height+'px';bg.appendChild(gh);return gh}
const WL_IC={add:'<path d="M12 5v14M5 12h14"/>',out:'<path d="M7 17 17 7M9 7h8v8"/>'};
function wlDate(t){try{const d=t&&t.toDate?t.toDate():null;return d?d.toLocaleString('en-GB',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):''}catch(e){return''}}
function wlNote(txt){list.innerHTML='';const d=document.createElement('div');d.className='empty';d.innerHTML='<svg class="ico" viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="3"/><path d="M3 10h18M16 15h2"/></svg><p></p>';d.querySelector('p').textContent=txt;list.appendChild(d)}
function wlRender(rows){
  if(!rows)return wlNote('Could not load transactions');
  if(!rows.length)return wlNote('No transactions yet');
  list.innerHTML='';
  for(const t of rows){const out=t.type==='withdraw'||t.type==='out',el=document.createElement('div');el.className='wl-it '+(out?'out':'add');
    el.innerHTML='<i class="wl-ic"><svg class="ico" viewBox="0 0 24 24">'+(out?WL_IC.out:WL_IC.add)+'</svg></i><div class="wl-mid"><b></b><small></small></div><span class="wl-am"></span>';
    el.querySelector('b').textContent=out?'Withdraw':'Add money';
    el.querySelector('small').textContent=[wlDate(t.createdAt),t.method,t.status].filter(Boolean).join(' · ');
    el.querySelector('.wl-am').textContent=(out?'- ':'+ ')+wlMoney(t.amount);
    list.appendChild(el)}
  gsap.from(list.children,{y:18,opacity:0,duration:.45,stagger:.04,ease:'power3.out',clearProps:'transform,opacity'})}
async function wlLoad(){
  const u=auth.currentUser;if(!u)return wlRender(null);
  if(wlUid!==u.uid){wlUid=u.uid;wlFirst=true}
  if(wlFirst)wlNote('Loading...');
  try{const s=await wlGet(wlQry(wlCol(db,'users',u.uid,'transactions'),wlOrd('createdAt','desc'),wlLim(100)));
    if(!wlOpen)return;wlFirst=false;wlRender(s.docs.map(d=>d.data()))}
  catch(e){console.error('wallet history',e);if(wlOpen)wlRender(null)}}
async function wlShow(){
  if(wlBusy||wlOpen||locked||running||Q.length)return;wlBusy=true;
  q('#wl_bal').textContent=q('#hm_bal').textContent;
  W.style.display='block';sc.scrollTop=0;clean();adReset();
  const g=geo(),G=ghost(g.c);
  // the sheet takes over the home card's shadow (same frame), so the shadow never doubles up or jumps
  card.style.boxShadow='';SH=getComputedStyle(card).boxShadow;SH0=SH.replace(/rgba?\(([^)]*)\)/,(m,a)=>{const p=a.split(',').map(x=>x.trim());return 'rgba('+p[0]+', '+p[1]+', '+p[2]+', 0)'});card.style.boxShadow='none';
  gsap.set(bg,{top:g.t,left:g.l,right:g.r,bottom:g.b,borderRadius:30,backgroundColor:INK,boxShadow:SH});
  gsap.set(gl,{opacity:0});gsap.set(kids(),{opacity:0,y:22});
  wlOpen=true;wlLoad();
  try{await new Promise(res=>{gsap.timeline({onComplete:res})
    .to(bg,{top:0,left:0,right:0,bottom:0,borderRadius:0,duration:DUR,ease:EASE},0)          // the card grows to the whole screen
    .to(bg,{backgroundColor:CREAM,duration:DUR,ease:'sine.inOut'},0)                           // ...turning from black to cream while it grows
    .to(bg,{boxShadow:SH0,duration:DUR,ease:'sine.inOut'},0)                                   // ...its shadow melts away smoothly
    .to(G,{opacity:0,duration:.3,ease:'power1.out'},0)                                         // the card's own text fades away
    .to(gl,{opacity:1,duration:.4,ease:'power1.out'},DUR-.4)                                   // the app background's soft glow
    .to(kids(),{opacity:1,y:0,duration:.6,stagger:.11,ease:'power3.out'},DUR-.2)})}            // title, card, buttons, history float up one by one
  finally{clean();wlBusy=false}}
async function wlHide(){
  if(wlBusy||!wlOpen||adState)return;wlBusy=true;
  if(sc.scrollTop>2){sc.scrollTo({top:0,behavior:'smooth'});await wait(300)}
  const g=geo();let G=null;
  try{
    gsap.set(bg,{backgroundColor:CREAM,boxShadow:SH0});G=ghost(g.c);gsap.set(G,{opacity:0});
    await new Promise(res=>{gsap.timeline({onComplete:res})
      .to(kids(),{opacity:0,y:14,duration:.28,stagger:{each:.04,from:'end'},ease:'power2.in'},0)
      .to(gl,{opacity:0,duration:.4,ease:'power1.in'},.15)
      .to(bg,{top:g.t,left:g.l,right:g.r,bottom:g.b,borderRadius:30,duration:DUR,ease:EASE},.2)
      .to(bg,{backgroundColor:INK,duration:DUR,ease:'sine.inOut'},.2)
      .to(bg,{boxShadow:SH,duration:DUR,ease:'sine.inOut'},.2)                                // the shadow grows back to exactly the home card's shadow
      .to(G,{opacity:1,duration:.3,ease:'power1.in'},.2+DUR-.3)})}
  finally{W.style.display='none';card.style.boxShadow='';clean();wlOpen=false;wlBusy=false}}   // card's own shadow returns in the same frame the sheet disappears
let wbDown=false;card.addEventListener('pointerdown',e=>{wbDown=!!e.target.closest('.wb')},true);   // a press that STARTED on Add money / Withdraw never opens the wallet
card.onclick=e=>{const hit=wbDown||e.target.closest('.wb');wbDown=false;if(hit)return;wlShow()};
q('#wl_back').onclick=wlHide;
document.querySelectorAll('#wlpg [data-toast]').forEach(b=>b.onclick=()=>toast(b.dataset.toast))

// ======================================================================
// @@WALLET-ADDMONEY   "Add money" button of the wallet page
//   Tap Add money > it pushes Withdraw off the right edge like soft slime (the page glides to the top at the same time), settles in the middle
//   of the row, then grows into a pop-up. The + icon and the "Add money" label fly from the button to the top of the pop-up.
//   Pop-up: Enter amount box, quick amounts 20 / 50 / 100 / 500, Proceed to payment > splits into Cancel | Confirm (see @@WALLET-ADDMONEY-PROCEED below).
//   Tap outside the pop-up or the X to close: the whole thing plays backwards (pop-up shrinks into the button, Withdraw slides back).
//   HTML: <!-- @@WALLET-ADDMONEY -->  CSS: /* @@WALLET-ADDMONEY */
// ======================================================================
{const row=q('.wl-act'),bAdd=q('#wl_add'),bOut=row.querySelector('.wb.out'),scrim=q('#ad_sc'),pop=q('#ad_pop'),inn=q('#ad_in'),wh=q('#ad_wh'),gr=q('#ad_gr'),ic=q('#ad_ic'),ti=q('#ad_ti'),xb=q('#ad_x'),amt=q('#ad_amt'),
  chips=[...pop.querySelectorAll('.ad-ch button')],items=[...pop.querySelectorAll('.ad-i')],all=[bAdd,bOut,pop,scrim,ic,ti,wh,gr,xb,...items];
let adOut=300,AG={};
const rel=r=>{const w=W.getBoundingClientRect();return{l:r.left-w.left,t:r.top-w.top,w:r.width,h:r.height}};
const adTxt=()=>{const n=[...bAdd.childNodes].find(x=>x.nodeType===3&&x.textContent.trim()),r=document.createRange();r.selectNodeContents(n);return r.getBoundingClientRect()};
const adTop=async()=>{for(let i=0;i<40&&sc.scrollTop>1;i++)await wait(30)};
const mark=()=>{amt.parentNode.classList.remove('bad');chips.forEach(c=>c.classList.toggle('on',c.dataset.v===amt.value))};
// where the + icon and the label must start (on top of the button's own icon / text) so they can fly into the pop-up
const adFlip=ar=>{const oi=rel(bAdd.querySelector('svg').getBoundingClientRect()),ot=rel(adTxt());
  return{ic:{x:oi.l+oi.w/2-(ar.l+AG.icx),y:oi.t+oi.h/2-(ar.t+AG.icy),scale:oi.w/AG.iw},ti:{x:ot.l+ot.w/2-(ar.l+AG.tcx),y:ot.t+ot.h/2-(ar.t+AG.tcy),scale:ot.w/AG.tw}}};
adReset=()=>{gsap.killTweensOf(all);gsap.set(all,{clearProps:'all'});gwReset();amt.value='';mark();adState=0};

// 1) slime push: Add money squats, stretches into Withdraw, Withdraw squashes and is flung off the right edge, Add wobbles into the middle
function adPush(){return new Promise(res=>{
  const sr=sc.getBoundingClientRect(),a=bAdd.getBoundingClientRect(),w=bOut.getBoundingClientRect(),r=row.getBoundingClientRect();
  const dx=r.left+r.width/2-(a.left+a.width/2);adOut=sr.right-w.left+40;
  gsap.set(bAdd,{transformOrigin:'0% 50%'});gsap.set(bOut,{transformOrigin:'100% 50%'});
  const F={v:0};let prev=0;gsap.set(bAdd,{zIndex:2});   // Add is always on top of Withdraw
  const sync=()=>{   // Withdraw's left edge can never go inside Add: Add's front edge squashes it, then it flies free (stretching a little)
    const R=a.left+gsap.getProperty(bAdd,'x')+gsap.getProperty(bAdd,'scaleX')*a.width+2,vF=F.v-prev;prev=F.v;
    const c=R-(w.left+F.v);let s=1;
    if(c>0)s=Math.max(.55,1-c/w.width);else s=1+Math.min(.25,vF*.02);
    const xw=Math.max(F.v,R-w.right+s*w.width);
    gsap.set(bOut,{x:xw,scaleX:s,scaleY:1+(1-s)*.5})};
  gsap.timeline({onUpdate:sync,onComplete:()=>gsap.set(bOut,{visibility:'hidden'})})
    .to(bAdd,{scaleX:.92,scaleY:1.06,duration:.15,ease:'power2.out'},0)
    .to(bAdd,{x:dx*.55,scaleX:1.2,scaleY:.92,duration:.28,ease:'power2.out'},.15)
    .to(bAdd,{x:dx,scaleX:1,scaleY:1,duration:.45,ease:'power3.out'},.43)
    .to(F,{v:adOut,duration:.8,ease:'power2.out'},.3)
    .call(res,null,.88)})}   // the pop-up starts growing the moment Add reaches the middle (Withdraw is still flying out underneath)

// 2) the button grows into the pop-up (icon + label travel into it)
async function adGrow(){
  const Wr=W.getBoundingClientRect(),ar=rel(bAdd.getBoundingClientRect()),pw=Math.min(Wr.width-40,360);
  gsap.set([ic,ti,wh,gr,pop,scrim,xb,...items],{clearProps:'all'});gwReset();
  inn.style.width=pw+'px';pop.style.display='block';pop.style.visibility='hidden';gwInit();
  const ph=inn.offsetHeight,fl=(Wr.width-pw)/2,ft=Math.max(16,(Wr.height-ph)*.42);
  const ib=inn.getBoundingClientRect(),ir=ic.getBoundingClientRect(),tr=ti.getBoundingClientRect();
  AG={ph,ft,iw:ir.width,tw:tr.width,icx:ir.left-ib.left+ir.width/2,icy:ir.top-ib.top+ir.height/2,tcx:tr.left-ib.left+tr.width/2,tcy:tr.top-ib.top+tr.height/2};
  const f=adFlip(ar);
  gsap.set(pop,{left:ar.l,top:ar.t,width:ar.w,height:ar.h,borderRadius:26,boxShadow:'0 12px 26px rgba(79,86,230,.3)',visibility:'visible'});
  gsap.set(ic,{...f.ic,backgroundColor:'rgba(255,255,255,.24)',color:'#fff'});gsap.set(ti,{...f.ti,color:'#fff'});
  gsap.set(gr,{opacity:1});gsap.set(wh,{opacity:0});gsap.set(items,{opacity:0,y:18});gsap.set(xb,{opacity:0});
  scrim.style.display='block';gsap.set(scrim,{opacity:0});gsap.set(bAdd,{opacity:0});
  await new Promise(res=>{gsap.timeline({onComplete:res})
    .to(scrim,{opacity:1,duration:.5,ease:'power1.out'},0)
    .to(pop,{left:fl,top:ft,width:pw,height:ph,borderRadius:30,duration:.8,ease:'power3.inOut'},0)
    .to(pop,{boxShadow:'0 30px 70px rgba(30,41,100,.35)',duration:.8,ease:'sine.inOut'},0)
    .to(wh,{opacity:1,duration:.3,ease:'none'},0)
    .to(gr,{opacity:0,duration:.5,ease:'sine.inOut'},.2)
    .to(ic,{x:0,y:0,scale:1,duration:.8,ease:'power3.inOut'},0)
    .to(ic,{backgroundColor:'rgba(99,102,241,.14)',color:'#4f74f4',duration:.5,ease:'sine.inOut'},.2)
    .to(ti,{x:0,y:0,scale:1,duration:.8,ease:'power3.inOut'},0)
    .to(ti,{color:'#0f1730',duration:.5,ease:'sine.inOut'},.2)
    .to(items,{opacity:1,y:0,duration:.5,stagger:.08,ease:'power3.out'},.55)
    .to(xb,{opacity:1,duration:.3},.9)});
  gsap.set([ic,ti],{clearProps:'backgroundColor,color'})}

async function adOpen(){
  if(adState||wlBusy||!wlOpen)return;adState=1;
  bAdd.style.transition=bOut.style.transition='none';   // the buttons' css press-transition would fight the slime animation
  try{sc.scrollTo({top:0,behavior:'smooth'});await adPush();await adTop();await adGrow();adState=2}
  catch(e){console.error('add money',e);adReset()}}

// 3) close: everything plays backwards
async function adClose(){
  if(adState!==2||gwState===1)return;adState=1;amt.blur();
  const ar=rel(bAdd.getBoundingClientRect()),f=adFlip(ar),pm=gwState===4;   // pm: closing from the payment boxes screen - goes straight into the Add money button
  if(pm)gsap.set(ti,{visibility:'visible',opacity:0,x:f.ti.x,y:f.ti.y,scale:f.ti.scale,color:'#fff'});
  await new Promise(res=>{const tl=gsap.timeline({onComplete:res});tl
    .to(items,{opacity:0,y:10,duration:.25,stagger:{each:.04,from:'end'},ease:'power2.in'},0)
    .to(xb,{opacity:0,duration:.2},0)
    .to(pop,{left:ar.l,top:ar.t,width:ar.w,height:ar.h,borderRadius:26,y:0,duration:.75,ease:'power3.inOut'},.2)
    .to(pop,{boxShadow:'0 12px 26px rgba(79,86,230,.3)',duration:.75,ease:'sine.inOut'},.2)
    .to(gr,{opacity:1,duration:.4,ease:'sine.inOut'},.45)
    .to(ic,{...f.ic,backgroundColor:'rgba(255,255,255,.24)',color:'#fff',duration:.75,ease:'power3.inOut'},.2)
    .to(ti,{...f.ti,color:'#fff',duration:.75,ease:'power3.inOut'},.2)
    .to(scrim,{opacity:0,duration:.5,ease:'power1.in'},.35);
    if(pm)tl.to(pms,{opacity:0,duration:.2,ease:'power2.in'},0).to(cb,{opacity:0,duration:.2},0).to(t2,{opacity:0,duration:.15},0)   // boxes + title vanish at once, the back arrow turns into the + while the pop-up shrinks
      .to(bkSv,{opacity:0,rotation:90,duration:.25},0).to(icSv,{opacity:1,rotation:0,scale:1,duration:.3},.2).to(ti,{opacity:1,duration:.35},.35)});
  gsap.set(bAdd,{opacity:1});gsap.set([pop,scrim,ic,ti,wh,gr,xb,...items],{clearProps:'all'});
  gsap.set(bOut,{visibility:'visible',x:adOut,scaleX:1,scaleY:1,skewX:0});
  await new Promise(res=>{gsap.timeline({onComplete:res})   // same duration + same ease for both: Add glides left, Withdraw slides in from the right edge, never touching
    .to(bAdd,{x:0,duration:.75,ease:'power3.inOut'},0)
    .to(bOut,{x:0,duration:.75,ease:'power3.inOut'},0)});
  gsap.set([bAdd,bOut],{clearProps:'all'});bAdd.style.transition=bOut.style.transition='';adState=0}

bAdd.onclick=adOpen;scrim.onclick=adClose;xb.onclick=adClose;
chips.forEach(c=>c.onclick=()=>{amt.value=c.dataset.v;mark();gsap.fromTo(amt.parentNode,{scale:.97},{scale:1,duration:.5,ease:'elastic.out(1,.4)',clearProps:'scale'})});
amt.oninput=()=>{amt.value=amt.value.replace(/\D/g,'').replace(/^0+(?=\d)/,'');mark()};
amt.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();amt.blur()}};

// ---- @@WALLET-ADDMONEY-PROCEED   Proceed to payment button: ball runs left > right, eating the label; the colour is pulled out of the left side
//   (the outline stays), when the colour reaches the middle it jellies out as the right box; the outline shrinks into the left box (Cancel);
//   the ball then returns and writes Confirm in the coloured box. Cancel closes the pop-up. Confirm does nothing yet.
const t2=q('#ad_t2'),icSv=ic.querySelector('svg'),bkSv=q('#ad_bk'),pmw=q('#ad_pm'),pms=[...pmw.children],gw=q('#ad_gw'),gb=q('#ad_gb'),gf=q('#ad_gf'),ball=q('#ad_ball'),tx=q('#ad_tx'),cl=q('#ad_cl'),cf=q('#ad_cf'),clw=q('#ad_clw'),cfw=q('#ad_cfw');
let gwState=0,GM={};   // gwState: 0 ready, 1 animating, 2 split (Cancel | Confirm)
let selP=null,pickBusy=false,PM={};   // selP = chosen payment box, PM = pop-up sizes of the payment screen
const cb=q('#ad_cb'),cb0=q('#ad_cb0'),cb1=q('#ad_cb1'),cbt=q('#ad_cbt');
const gwReset=()=>{gsap.killTweensOf([gb,gf,ball,tx,cl,cf,t2,icSv,bkSv,pmw,cb,cb0,cb1,cbt,...pms]);gsap.set([gb,gf,ball,tx,cl,cf,t2,icSv,bkSv,pmw,cb,cb0,cb1,cbt,...pms],{clearProps:'all'});selP=null;pickBusy=false;cb0.style.background=cb1.style.background='';cb1.style.clipPath='';cbt.style.color='';pms.forEach(b=>b.classList.remove('on'));gwState=0;amt.parentNode.classList.remove('bad')};
const gwInit=()=>{const g=12,Wd=gw.offsetWidth,wl=(Wd-g)/2;
  clw.style.width=wl+'px';cfw.style.left=(wl+g)+'px';cfw.style.width=wl+'px';
  GM={Wd,wl,xr:wl+g,cx0:tx.offsetLeft+4.5};gsap.set(ball,{x:GM.cx0})};
// empty amount: no animation, the Enter amount box shakes and its text turns red (until something is typed / a quick amount is tapped)
function gwShake(){const b=amt.parentNode;b.classList.add('bad');gsap.killTweensOf(b);
  gsap.timeline({onComplete:()=>gsap.set(b,{x:0})}).to(b,{x:-11,duration:.06}).to(b,{x:10,duration:.1}).to(b,{x:-8,duration:.1}).to(b,{x:6,duration:.09}).to(b,{x:-3,duration:.08}).to(b,{x:0,duration:.07})}
async function gwGo(){
  if(gwState||adState!==2)return;
  if(!(Number(amt.value)>0)){gwShake();return}
  gwState=1;amt.blur();
  const{Wd,wl,xr,cx0}=GM,xS=xr+16,xe=Wd-27,cfL=xr+cf.offsetLeft,dot=cfL+4.5;
  const clip=bx=>{tx.style.clipPath='inset(0 0 0 '+Math.min(tx.offsetWidth,Math.max(0,bx-tx.offsetLeft))+'px)'};   // the label vanishes into the ball
  let split=false;const B={v:0};
  cf.style.clipPath='inset(0 0 0 100%)';
  // ONE continuous run (the ball never stops): the colour is pulled left>right; the moment it gets to the middle the box tears in two:
  // the outline (left box) and the colour (right box) both squeeze a little and wobble into their own places, while Cancel floats in
  gsap.timeline({onComplete:()=>{cf.style.clipPath='';gwState=2}})
    .to(gb,{opacity:1,duration:.1},0)
    .to(B,{v:1,duration:.45,ease:'power2.in',onUpdate:()=>{
      const bx=cx0+(xe-cx0)*B.v;gsap.set(ball,{x:bx});clip(bx);
      if(split)return;
      const k=Math.min(1,(bx-cx0)/(xS-cx0));gsap.set(gf,{width:Wd-(xr-14)*k});   // colour's left edge follows the ball
      if(k>=1){split=true;
        gsap.to(gb,{width:wl,duration:.8,ease:'elastic.out(1,.5)'});
        gsap.to(gf,{width:wl,duration:.8,ease:'elastic.out(1,.5)'});
        gsap.fromTo(cl,{opacity:0,y:10},{opacity:1,y:0,duration:.45,ease:'power3.out',delay:.1})}}},0)
    .set(tx,{opacity:0},.45).set(cf,{opacity:1},.45)
    .fromTo(ball,{x:xe},{x:dot,duration:.55,ease:'power2.inOut',immediateRender:false,   // ball comes back right>left, writing Confirm as it goes, and settles in the dot place
      onUpdate:()=>{cf.style.clipPath='inset(0 0 0 '+Math.max(0,gsap.getProperty(ball,'x')-cfL)+'px)'}},.45)}
// ---- @@WALLET-ADDMONEY-PAYMETHOD   tap Confirm: everything except the + melts into the pop-up while the pop-up grows taller (as much as the boxes need);
//   4 payment boxes slide straight in from the left / right edge of the page; the + goes to the top-left corner of the pop-up and turns into a back arrow;
//   "Select payment method" floats up by itself. Tap the arrow (adBack): boxes leave the way they came, the pop-up shrinks back and the amount screen returns.
//   (gwState 4 = payment boxes shown)
async function adPay(){
  gwState=1;amt.blur();
  const Wr=W.getBoundingClientRect(),pw=inn.offsetWidth,melt=[ti,...items,xb];
  const BH=Math.min(136,Math.floor((Wr.height-32-84-12-22-70)/2)),gh=2*BH+12,ph2=84+gh+22,ph3=ph2+70,ft2=Math.max(16,(Wr.height-ph3)*.42);   // taller pop-up (ph3 = with the Confirm button)
  PM={gh,ph2,ph3};pmw.style.height=gh+'px';cb.style.top=(84+gh+16)+'px';
  const rg=document.createRange();rg.selectNodeContents(t2);if((pw-rg.getBoundingClientRect().width)/2<68)t2.style.fontSize='13px';   // narrow screen: smaller text so it never touches the back arrow
  // (the title is centred by css: full width of the pop-up + text-align:center, so it is exactly in the middle)
  gsap.set(pmw,{visibility:'visible'});gsap.set(t2,{opacity:0,y:10});
  pms.forEach((b,i)=>gsap.set(b,{x:i%2?Wr.width:-Wr.width}));       // left column waits outside the left edge, right column outside the right edge
  await new Promise(res=>{gsap.timeline({onComplete:res})
    .to(melt,{opacity:0,scale:.8,duration:.4,ease:'power2.in',stagger:.04},0)
    .set(melt,{visibility:'hidden'},.65)
    .to(pop,{top:ft2,height:ph2,duration:.8,ease:'power2.inOut'},0)
    .to(pms,{x:0,duration:.8,ease:'power3.out'},.3)                                       // straight, smooth slide-in
    .to(ic,{scale:40/56,x:40-AG.icx,y:42-AG.icy,duration:.7,ease:'power3.inOut'},.15)     // + goes to the top-left (a bit inside the corner)...
    .to(icSv,{opacity:0,rotation:90,duration:.3,ease:'power2.in'},.25)
    .fromTo(bkSv,{opacity:0,rotation:-90},{opacity:1,rotation:0,duration:.4,ease:'power2.out',immediateRender:false},.5)   // ...and becomes a back arrow
    .to(t2,{opacity:1,y:0,duration:.55,ease:'power3.out'},.6)});                          // title floats up
  gsap.set(pms,{clearProps:'transform'});gwState=4}
async function adBack(){
  if(gwState!==4)return;gwState=1;
  const Wr=W.getBoundingClientRect(),melt=[ti,...items,xb];
  gsap.killTweensOf([gb,gf,ball,tx,cl,cf]);gsap.set([gb,gf,ball,tx,cl,cf],{clearProps:'all'});gwInit();   // button back to "Proceed to payment" while still invisible
  gsap.set(melt,{visibility:'visible'});
  await new Promise(res=>{gsap.timeline({onComplete:res})
    .to(pms,{x:i=>i%2?Wr.width:-Wr.width,duration:.7,ease:'power3.in'},0)                  // boxes leave the way they came
    .to(t2,{opacity:0,y:-8,duration:.3,ease:'power2.in'},0)
    .to(cb,{opacity:0,y:10,duration:.25,ease:'power2.in'},0)
    .to(bkSv,{opacity:0,rotation:90,duration:.3,ease:'power2.in'},.05)
    .to(icSv,{opacity:1,rotation:0,duration:.4,ease:'power2.out'},.3)
    .to(ic,{x:0,y:0,scale:1,duration:.7,ease:'power3.inOut'},.1)
    .to(pop,{top:AG.ft,height:AG.ph,duration:.8,ease:'power2.inOut'},.2)                   // pop-up shrinks back
    .to(melt,{opacity:1,scale:1,duration:.45,ease:'power2.out',stagger:.05},.5)});         // title, amount box, quick amounts, button, X come back
  gwReset();gwInit();}                                                                      // button is "Proceed to payment" again, the amount stays
ic.onclick=()=>{if(gwState===4)adBack()};
// ---- @@WALLET-ADDMONEY-PICK   choose a payment box: the pop-up grows downward and a Confirm button appears in that method's colour.
//   Choosing another box: the new colour sweeps across the button from the side where that box is (left column > from the left, right column > from the right).
const COL={bkash:['#E2136E','#fff'],nagad:['linear-gradient(135deg,#F7941D,#ED1C24)','#fff'],rocket:['#8A288F','#fff'],binance:['#F0B90B','#1E2329']};   // [button colour, text colour]
async function pmPick(b,i){
  if(gwState!==4||pickBusy||b===selP)return;pickBusy=true;
  const c=COL[b.dataset.p],first=!selP,fromLeft=i%2===0;
  selP=b;pms.forEach(x=>x.classList.toggle('on',x===b));
  if(first){
    cb0.style.background=c[0];cbt.style.color=c[1];gsap.set(cb,{visibility:'visible',opacity:0,y:14});
    await new Promise(res=>{gsap.timeline({onComplete:res})
      .to(pop,{height:PM.ph3,duration:.7,ease:'power2.inOut'},0)                 // pop-up grows from the bottom
      .to(cb,{opacity:1,y:0,duration:.5,ease:'power3.out'},.3)})}
  else{
    cb1.style.background=c[0];const k={v:100},set=()=>{cb1.style.clipPath=fromLeft?'inset(0 '+k.v+'% 0 0)':'inset(0 0 0 '+k.v+'%)'};set();
    await new Promise(res=>{gsap.timeline({onComplete:res})
      .to(k,{v:0,duration:.6,ease:'power2.inOut',onUpdate:set},0)
      .to(cbt,{color:c[1],duration:.3},.15)});
    cb0.style.background=c[0];cb1.style.clipPath='inset(0 100% 0 0)'}
  pickBusy=false}
pms.forEach((b,i)=>b.onclick=()=>pmPick(b,i));
gw.onclick=e=>{if(!gwState)return gwGo();if(gwState!==2)return;if(e.clientX-gw.getBoundingClientRect().left<GM.wl+6)adClose();else adPay()};
// keyboard: if it would cover the pop-up, lift the pop-up so the box and the button stay visible
const kb=()=>{if(adState!==2)return;const vv=window.visualViewport;if(!vv)return;const y=gsap.getProperty(pop,'y'),r=pop.getBoundingClientRect(),top=r.top-y,bot=r.bottom-y;
  gsap.to(pop,{y:Math.max(-(top-8),Math.min(0,vv.offsetTop+vv.height-12-bot)),duration:.3,ease:'power2.out'})};
amt.addEventListener('focus',()=>setTimeout(kb,350));amt.addEventListener('blur',()=>{if(adState===2)gsap.to(pop,{y:0,duration:.3,ease:'power2.out'})});
window.visualViewport&&window.visualViewport.addEventListener('resize',kb)}
}

</script>
<template data-name="wallet">
    <!-- @@WALLET - full-screen wallet page: back arrow + title, card (same size as the home card; "secured" pill instead of buttons), Add money / Withdraw, transaction history -->
