      <section class="wallet wl-card"><div class="w-l">WALLET BALANCE</div><div class="w-b" id="wl_bal">BDT 0.00</div>
        <div class="w-r"><div class="wl-sec"><svg class="ico" viewBox="0 0 24 24"><path d="M12 3l7 3v5c0 4.5-3 8-7 10-4-2-7-5.5-7-10V6z"/><path d="M9 12l2 2 4-4"/></svg>Wallet secured by Ultimate Tour</div></div></section>
      <div class="wl-act"><button class="wb add" type="button" id="wl_add"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add money</button><button class="wb out" type="button" data-toast="Withdraw is coming soon"><svg class="ico" viewBox="0 0 24 24"><path d="M7 17 17 7M9 7h8v8"/></svg>Withdraw</button></div>
      <h3 class="hm-h wl-h">Transaction history</h3>
      <div class="wl-ls" id="wl_list"></div>
    </div>
    <!-- @@WALLET-ADDMONEY - dim layer + pop-up (the Add money button grows into it): + icon, title, Enter amount box, quick amounts, Proceed to payment -->
    <div id="ad_sc"></div>
    <div id="ad_pop"><i id="ad_wh"></i><i id="ad_gr"></i>
      <div id="ad_in">
        <button type="button" id="ad_x" aria-label="Close"><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button>
        <div id="ad_hd"><span id="ad_ic"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><svg class="ico" id="ad_bk" viewBox="0 0 24 24"><path d="M19 12H5M11 6l-6 6 6 6"/></svg></span><span id="ad_ti">Add money</span></div>
        <label class="ad-box ad-i"><b>BDT</b><input id="ad_amt" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="7" autocomplete="off" placeholder="Enter amount"></label>
        <div class="ad-ch ad-i"><button type="button" data-v="20">20</button><button type="button" data-v="50">50</button><button type="button" data-v="100">100</button><button type="button" data-v="500">500</button></div>
        <div class="ad-gw ad-i" id="ad_gw" role="button" tabindex="0">
          <i id="ad_gb"></i><i id="ad_gf"></i>
          <div id="ad_tp"><span id="ad_tx">Proceed to payment</span></div>
          <div id="ad_clw"><span id="ad_cl">Cancel</span></div><div id="ad_cfw"><span id="ad_cf">Confirm</span></div>
          <i id="ad_ball"></i>
        </div>
        <!-- @@WALLET-ADDMONEY-PAYMETHOD  (each logo is an <img> with the picture embedded inside the src (data:image/png;base64,...); to change a logo replace that src) -->
        <span id="ad_t2">Select payment method</span>

<script type="text/plain" data-kind="css" data-order="90">
/* ===== pages/admin/admin.css ===== */
/* @@ADMIN stats boxes, Admin Panel option, authentication pop-up, admin page */
.pf-stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.pf-st{background:#fff;border-radius:22px;box-shadow:0 12px 26px rgba(30,41,100,.08);padding:16px 12px;display:grid;gap:6px;justify-items:center;text-align:center}
.pf-st b{font:800 32px/1 var(--sans);letter-spacing:-.02em}
.pf-st small{font:700 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#6b7692}
.pf-adm{all:unset;box-sizing:border-box;display:flex;align-items:center;gap:14px;padding:12px;border-radius:22px;background:#fff;box-shadow:0 12px 26px rgba(30,41,100,.08);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:transform .2s}
.pf-adm:active{transform:scale(.98)}
.pf-adm span{flex:1;font:700 13px var(--mono);letter-spacing:.16em;text-transform:uppercase}
.pf-adm .pf-ch{width:20px;height:20px;color:#6b7692}
.pfp-t{margin:0;font:700 13px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#fff}
.pfp-in.adm-in{letter-spacing:.06em;font-size:15px;text-align:left}.pfp-in.adm-in::placeholder{letter-spacing:.02em;font-size:13px}
.adm-msg{min-height:18px;color:#ff8a7a}
.pfp-ok svg{width:20px;height:20px;margin-right:10px}.adm-t{font-size:12px;letter-spacing:.06em}
.pfp-ok.lk{background:#2b3463;border-color:rgba(255,255,255,.12);color:#9aa3c8;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.adm-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px}
/* admin pop-up v2: white, header (logo + label fly in from the box), smooth clip-path growth, white admin page */
.pfp.adm{background:#fff;color:#0f1730;box-shadow:none}
.pfp-hd{padding:24px 20px 0;display:grid;justify-items:center;gap:10px;text-align:center}
.pfp-t{margin:0;font:700 13px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:#0f1730}.pfp-t span{display:inline-block}
.pfp-s{margin:-4px 0 0;font:700 11px var(--mono);letter-spacing:.2em;text-transform:uppercase;color:#6b7692}
.pfp-c.adm-c{padding:18px 20px 22px}
.pfp.adm .pfp-cd small{color:#6b7692}
.pfp.adm .pfp-in{background:#f1f4fc;border-color:#dfe4f3;color:#0f1730}.pfp.adm .pfp-in:focus{border-color:var(--green)}
.pfp.adm .pfp-in::placeholder{color:#a4acc0}.pfp.adm .pfp-in.bad{border-color:#d6452a}
.pfp.adm .adm-msg{color:#d6452a}
.pfp.adm .pfp-ok{background:var(--grad);color:#fff;border:0}
.pfp.adm .pfp-ok.lk{background:#e3e7f3;color:#8791a8}
.pfp.adm .pfp-ok .dot{background:#fff}.pfp.adm .pfp-ok .ring{border-color:#fff;border-right-color:transparent}
.pfp-ok svg.tkk{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px;color:#9db4ff}
.pfp.adm .pfp-ok svg.tkk{color:#fff}
.adm-pg{position:fixed;inset:0;z-index:99998;background:#fff;touch-action:none}
.adm-x{position:absolute;top:calc(env(safe-area-inset-top,0px) + 14px);right:16px}
/* admin pop-up v3: compact, same-size labels, slightly bigger logo */
.pfp-hd{padding:18px 20px 0;gap:8px}
.pfp.adm .pfp-hd .ic{width:52px;height:52px;border-radius:15px}
.pfp.adm .pfp-hd .ic b svg{width:28px;height:28px}
.pfp-t,.pfp-s{margin:0;font:700 15px/1.2 var(--mono);letter-spacing:.16em;text-transform:uppercase}
.pfp-t{color:#0f1730}.pfp-s{color:#6b7692}
.pfp-c.adm-c{padding:12px 20px 18px;gap:8px}
.pfp.adm .pfp-in{height:44px}
.pfp.adm .adm-msg{min-height:14px;font-size:11px;line-height:14px}
.pfp.adm .pfp-ok{height:48px}
/* admin page: whole screen is the page; title capsule + navigation bar float above it (frosted glass) */
.adm-pg{touch-action:auto}
.adm-body{position:absolute;z-index:0;inset:0;overflow-x:hidden;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;touch-action:pan-y;padding:calc(env(safe-area-inset-top,0px) + 146px) 16px calc(env(safe-area-inset-bottom,0px) + 28px)}
.adm-hd{position:absolute;z-index:4;left:16px;top:calc(env(safe-area-inset-top,0px) + 10px);display:flex;align-items:center;gap:4px;height:46px;padding:0 18px 0 4px;border-radius:99px;background:rgba(255,255,255,.82);-webkit-backdrop-filter:blur(16px) saturate(1.6);backdrop-filter:blur(16px) saturate(1.6);border:1px solid rgba(99,102,241,.14);box-shadow:0 12px 28px rgba(60,72,140,.18),inset 0 1px 0 #fff}
.adm-bk{all:unset;box-sizing:border-box;width:38px;height:38px;display:grid;place-items:center;border-radius:50%;color:var(--pri);cursor:pointer;-webkit-tap-highlight-color:transparent;transition:background .2s}
.adm-bk:active{background:rgba(99,102,241,.14)}.adm-bk .ico{width:26px;height:26px;stroke-width:3}
.adm-ttl{margin:0;font:700 17.5px/1 var(--mono);letter-spacing:.1em;text-transform:uppercase;color:var(--green);-webkit-text-stroke:.6px var(--green)}

    const sr=document.createElement('div');sr.className='adm-sr';
    sr.innerHTML='<svg class="ico sr-i" viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/><path d="M16.6 16.6L21 21"/></svg><input class="sr-in" type="text" inputmode="search" enterkeyhint="search" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="Search Players"><button class="sr-x" type="button" aria-label="Clear" hidden><svg class="ico" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></svg></button><span class="sr-cnt"><b>-</b><small>Players</small></span>';
    // ---- one section per tab, sliding like the Home pages: pages sit side by side; tab on the right = old page leaves LEFT and the new one arrives from the RIGHT (tab on the left = reverse).

    const SK=ADM_TABS.map(t=>t[0]),SEC=SK.map(k=>bd2.querySelector('#adm_'+k)),SX=SK.map(()=>0),STW=SK.map(()=>null),SDONE=SK.map(()=>null),scrAt={},SLIDE={d:.38,e:'power3.out'};let sCur=0,srOn=true;

    const sMove=(i,to,dur)=>new Promise(res=>{if(STW[i])STW[i].kill();if(SDONE[i])SDONE[i]();SDONE[i]=res;const o={x:SX[i]};

      gsap.fromTo([pwIn,bpIn],{x:-9},{x:0,duration:.5,ease:'elastic.out(1,.3)'})}};
  pp.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')){e.preventDefault();okb.click()}});
  // --- secret: hold the locked Verify button for 10s = unlock + ask for the bypass code
  let hold=null,hx=0,hy=0;
  okb.addEventListener('pointerdown',e=>{if(!okb._lk||done)return;hx=e.clientX;hy=e.clientY;clearTimeout(hold);
    hold=setTimeout(()=>{st={f:0,u:0,bp:true};admSet(st);msg.textContent='';lockNow(false,true);reflow(true);try{navigator.vibrate&&navigator.vibrate(40)}catch(x){}},10000)});
  okb.addEventListener('pointermove',e=>{if(hold&&Math.hypot(e.clientX-hx,e.clientY-hy)>12){clearTimeout(hold);hold=null}});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>okb.addEventListener(t,()=>{clearTimeout(hold);hold=null}));
  okb.addEventListener('contextmenu',e=>e.preventDefault())}


}
</script>

<script type="text/plain" data-kind="app" data-order="200">
/* ===== pages/players/players.js ===== */
// ======================================================================
// @@PLAYERS
// Admin Panel > Players page: player cards, live list, search, load more. Called by initAdmin() in pages/admin/admin.js.
// ======================================================================
function plSetup(X){
const {collection,onSnapshot,query,orderBy,limit,startAfter,where,getDocs,getCountFromServer}={collection:admFS_collection,onSnapshot:admFS_onSnapshot,query:admFS_query,orderBy:admFS_orderBy,limit:admFS_limit,startAfter:admFS_startAfter,where:admFS_where,getDocs:admFS_getDocs,getCountFromServer:admFS_getCountFromServer};   // Firestore helpers for the Admin Panel (imported at the top of this file)
const {db,E}=X;   // from app.js (db = Firestore, E = message table)
// ---- Players page: one card per registered player, newest account on top, live (a new account appears at the top by itself)
const PL_IC={plus:'<path d="M12 5v14M5 12h14"/>',minus:'<path d="M5 12h14"/>',msg:'<path d="M4 5h16v11H9l-5 4V5z"/>',ban:'<circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/>'};
const PL_BT=[['plus','Add'],['minus','Remove'],['msg','Message'],['ban','Ban']];
const plTime=p=>p.createdAt&&p.createdAt.toMillis?p.createdAt.toMillis():Date.now();   // a just-created account has no server time yet = newest
function plCard(){const c=document.createElement('article');c.className='pl-card';
  c.innerHTML='<div class="pl-top"><div class="pl-av"></div><div class="pl-id"><h4 class="pl-nm"></h4><p class="pl-un"></p></div></div>'
    +'<div class="pl-rows">'+[['email','Gmail','wide'],['phone','Phone',''],['pw','Password','']].map(([k,l,w])=>'<p class="pl-r '+w+'" data-k="'+k+'"><small>'+l+'</small><b></b></p>').join('')+'</div>'
    +'<div class="pl-act">'+PL_BT.map(([k,l])=>'<button class="pl-b '+k+'" type="button" aria-label="'+l+'"><svg class="ico" viewBox="0 0 24 24">'+PL_IC[k]+'</svg></button>').join('')+'</div>';return c}
function plFill(c,p){const un=p.username||'',av=c.querySelector('.pl-av');
  av.textContent=(un||p.name||'?')[0].toUpperCase();
  c.querySelector('.pl-nm').textContent=p.name||un||'Player';
  c.querySelector('.pl-un').textContent=un?'@'+un:'';
  const val={email:p.email||'',phone:p.phone||'',pw:'••••••••'};
  c.querySelectorAll('.pl-r').forEach(r=>{const b=r.querySelector('b'),t=val[r.dataset.k];b.textContent=t||'Not added';r.classList.toggle('no',!t)});
  const url=u=>typeof u==='string'&&/^https:\/\//.test(u)?'url('+JSON.stringify(u)+')':'';
  av.style.backgroundImage=url(p.photo);
  if(url(p.cover))c.style.setProperty('--cv','linear-gradient(rgba(15,23,70,.5),rgba(15,23,70,.82)),'+url(p.cover));else c.style.removeProperty('--cv')}
// relevance of one player for the typed text: higher = better match, 0 = no match
function plScore(p,q){
  const tk=q.toLowerCase().split(/\s+/).map(t=>t.replace(/^@/,'')).filter(Boolean);if(!tk.length)return 0;
  const nm=(p.name||'').toLowerCase(),un=(p.username||'').toLowerCase(),em=(p.email||'').toLowerCase(),ph=(p.phone||'').toLowerCase(),ph2=ph.replace(/[\s-]/g,'');
  let sum=0,hit=0;
  for(const t of tk){let b=0;
    for(const f of [nm,un,em,ph,ph2]){if(!f)continue;
      const v=f===t?100:f.startsWith(t)?70:(f===nm&&f.split(/\s+/).some(w=>w.startsWith(t)))?60:f.includes(t)?35:0;if(v>b)b=v}
    if(b){hit++;sum+=b}}
  return sum?sum+(hit===tk.length?20:0):0}
// Players page engine. Built for a big player base: 20 cards are read at first (the newest, kept live), more load while scrolling,
// the total is a cheap server count, search asks the database (never downloads everyone).
// Search = 3+ letters: the search icon spins ~1s while the database is asked, then the cards are RANKED (best match on top) in ONE smooth move.
// Everything runs one step at a time (a queue), so animations never overlap or collide.
function admPlayers(U){
  const {list,emp,cnt,inp,clr,sc,ico,mel}=U,sec=emp.parentNode,UC=collection(db,'users'),PAGE=10,SPAGE=20,all=new Map(),els=new Map(),sleep=ms=>new Promise(r=>setTimeout(r,ms));
  let mode='list',q='',cursor=null,more=true,loading=false,dripNext=false,pull=0,tracking=false,ty=0,init=false,live=false,dead=false,settled=true,hit=true,entry=true,active=false,nf=false,busy=false,dirty=false;
  let seq=0,tSrv=null,tRun=null,cT=null,off=false,shown=0,sp=Promise.resolve(),chain=Promise.resolve(),spin=null;
  try{shown=+localStorage.getItem('adm_pc')||0}catch(e){}
  cnt.textContent=shown?shown.toLocaleString('en-US'):'-';
  const add=(m,d)=>m.set(d.id,{id:d.id,...d.data()});
  const order=()=>{const d=[...all.values()].sort((a,b)=>plTime(b)-plTime(a));if(!q){hit=true;return d}
    const s=new Map(d.map(p=>[p.id,plScore(p,q)]));hit=d.some(p=>s.get(p.id)>0);return d.sort((a,b)=>s.get(b.id)-s.get(a.id)||plTime(b)-plTime(a))};
  // "No account found": the cards glide a little down, then the text floats up under the search bar (and the reverse)
  const setNF=on=>{if(on===nf)return;nf=on;sec.classList.toggle('nf',on);gsap.killTweensOf([emp,list]);
    if(on){emp.textContent='No account found';emp.hidden=false;gsap.to(list,{y:58,duration:.6,ease:'power3.inOut'});gsap.fromTo(emp,{opacity:0,y:-14},{opacity:1,y:0,duration:.55,delay:.25,ease:'power3.out'})}
    else{gsap.to(emp,{opacity:0,y:-10,duration:.25,ease:'power2.in',onComplete:()=>{if(!nf)emp.hidden=true}});gsap.to(list,{y:0,duration:.55,delay:.1,ease:'power3.inOut',clearProps:'transform'})}};
  const note=()=>{if(!all.size){if(init){emp.textContent='No players yet';emp.hidden=false;gsap.set(emp,{opacity:1,y:0})}return}setNF(mode==='find'&&settled&&!hit)};
  // FLIP: remember where every card is, re-order the DOM, then slide every card from its old place to its new one (all in the same time)
  function place(docs){
    const ids=new Set(docs.map(d=>d.id)),first=new Map(),fresh=[],moved=[];
    els.forEach((el,id)=>{gsap.killTweensOf(el);first.set(id,el.getBoundingClientRect().top)});
    els.forEach((el,id)=>{if(!ids.has(id)){el.remove();els.delete(id);first.delete(id)}else{el.classList.remove('pl-mv');gsap.set(el,{clearProps:'transform,zIndex'});if(+gsap.getProperty(el,'opacity')<1)gsap.to(el,{opacity:1,duration:.3,clearProps:'opacity'})}});
    docs.forEach((p,i)=>{let el=els.get(p.id);if(!el){el=plCard();els.set(p.id,el);fresh.push(el)}plFill(el,p);if(list.children[i]!==el)list.insertBefore(el,list.children[i]||null)});
    docs.forEach((p,i)=>{if(i<60&&first.has(p.id)){const el=els.get(p.id),d=first.get(p.id)-el.getBoundingClientRect().top;if(Math.abs(d)>1)moved.push([el,d,first.get(p.id)])}});
    const tl=gsap.timeline(),vh=innerHeight,vis=t=>t>-160&&t<vh+160,pg=list.closest('.adm-pg'),anim=moved.filter(m=>vis(m[2])||vis(m[2]-m[1]));   // cards far off-screen just jump, only visible ones are animated
    if(pg&&(anim.length||fresh.length))pg.classList.add('mv');
    anim.forEach(([el,d])=>{el.classList.add('pl-mv');el.style.zIndex=d>0?2:1;tl.fromTo(el,{y:d},{y:0,duration:.85,ease:'power3.inOut'},0)});   // the card going up floats above the others (but always below the glass bars)
    if(fresh.length)tl.fromTo(fresh.slice(0,12),{y:entry?30:90,opacity:0},{y:0,opacity:1,duration:.7,stagger:.06,ease:'power3.out',clearProps:'transform,opacity'},0);
    entry=false;
    return new Promise(res=>tl.call(()=>{moved.forEach(([el])=>{el.classList.remove('pl-mv');gsap.set(el,{clearProps:'transform,zIndex'})});if(pg)pg.classList.remove('mv');res()}))}
  // cards that are simply added at the end (first open, "load more") are created and shown one at a time: light for the phone and nice to watch
  async function drip(docs,follow){
    docs.forEach(p=>{const el=els.get(p.id);if(el)plFill(el,p)});
    let k=0;
    for(const p of docs){if(dead||els.has(p.id))continue;const el=plCard();els.set(p.id,el);plFill(el,p);list.insertBefore(el,list.children[docs.indexOf(p)]||null);
      gsap.fromTo(el,{y:30,opacity:0},{y:0,opacity:1,duration:.55,ease:'power3.out',clearProps:'transform,opacity'});
      if(follow&&k===1)sc.scrollBy({top:230,behavior:'smooth'});
      k++;await sleep(130)}
    entry=false}
  const syncMore=()=>{const show=live&&mode==='list'&&!nf&&all.size>0&&!dead;mel.hidden=!show;if(show){mel.textContent=loading?'Loading...':more?'Pull up to load more':'All players loaded';mel.classList.toggle('end',!more&&!loading)}};
  const doRender=async()=>{busy=true;try{const docs=order();if(dripNext&&mode==='list'&&docs.length){const f=dripNext==='more';dripNext=false;await drip(docs,f)}else await Promise.race([place(docs),sleep(1600)]);note();syncMore()}finally{busy=false;const g=list.closest('.adm-pg');if(g)g.classList.remove('mv')}if(dirty){dirty=false;render()}};
  const render=()=>{if(!live||dead)return;if(busy){dirty=true;return}doRender()};
  const idle=async()=>{while(busy)await sleep(30)};
  const toTop=()=>new Promise(res=>{if(sc.scrollTop<=2){res();return}sc.scrollTo({top:0,behavior:'smooth'});let n=0;const t=setInterval(()=>{if(sc.scrollTop<=1||++n>40){clearInterval(t);res()}},30)});
  // total number of accounts: fetched right away (before the page is on screen), the last known number is shown instantly
  const setCnt=n=>{const f=shown;shown=n;try{localStorage.setItem('adm_pc',n)}catch(e){}
    if(!live||f===n){cnt.textContent=n.toLocaleString('en-US');return}
    const o={v:f};gsap.to(o,{v:n,duration:.7,ease:'power2.out',onUpdate:()=>{cnt.textContent=Math.round(o.v).toLocaleString('en-US')}})};
  const fetchCnt=()=>getCountFromServer(UC).then(r=>{if(!off)setCnt(r.data().count)}).catch(()=>{});
  const count=()=>{clearTimeout(cT);cT=setTimeout(fetchCnt,250)};fetchCnt();
  // the newest 20, live: a new account arrives on top by itself
  const unsub=onSnapshot(query(UC,orderBy('createdAt','desc'),limit(PAGE)),snap=>{
    snap.docs.forEach(d=>add(all,d));
    if(!init){init=true;cursor=snap.docs[snap.docs.length-1]||null;more=snap.size>=PAGE}
    else if(snap.docChanges().some(c=>c.type==='added'))count();
    render()},
  err=>{dead=true;list.innerHTML='';els.clear();emp.textContent=E[err.code]||'Could not load players ('+(err.code||err.message)+')';emp.hidden=false;gsap.set(emp,{opacity:1,y:0})});
  // older players: pull up (firmly) while you are at the very bottom, or tap the label: the next 10 cards load one by one
  const loadMore=()=>{if(mode!=='list'||!more||loading||!cursor||busy)return;loading=true;syncMore();
    getDocs(query(UC,orderBy('createdAt','desc'),startAfter(cursor),limit(PAGE))).then(r=>{r.docs.forEach(d=>add(all,d));if(r.docs.length)cursor=r.docs[r.docs.length-1];more=r.size>=PAGE;loading=false;dripNext='more';render()}).catch(()=>{loading=false;syncMore()})};
  const atEnd=()=>sc.scrollTop+sc.clientHeight>=sc.scrollHeight-3;
  const setPull=p=>{pull=p;mel.style.transform=p?'translateY('+(-p*.4)+'px)':'';mel.style.opacity=p?Math.min(1,.45+p/110):'';if(!loading&&more&&!mel.hidden)mel.textContent=p>=70?'Release to load more':'Pull up to load more'};
  const tS=e=>{tracking=atEnd();ty=e.touches[0].clientY;pull=0};
  const tM=e=>{if(sec.hidden||mode!=='list'||!more||loading||busy)return;const y=e.touches[0].clientY;if(!tracking){if(!atEnd())return;tracking=true;ty=y}const dy=ty-y;setPull(dy>0?Math.min(dy,140):0)};
  const tE=()=>{const p=pull;setPull(0);tracking=false;if(p>=70)loadMore()};
  sc.addEventListener('touchstart',tS,{passive:true});sc.addEventListener('touchmove',tM,{passive:true});sc.addEventListener('touchend',tE,{passive:true});sc.addEventListener('touchcancel',tE,{passive:true});
  mel.onclick=loadMore;
  // search icon: spins while the search is being prepared, then settles smoothly
  const spinOn=()=>{if(spin)return;gsap.killTweensOf(ico);spin=gsap.to(ico,{rotation:'+=360',duration:1,ease:'none',repeat:-1})};
  const spinOff=()=>{if(!spin)return;spin.kill();spin=null;const r=+gsap.getProperty(ico,'rotation');gsap.to(ico,{rotation:Math.ceil(r/360)*360,duration:.3,ease:'power2.out',onComplete:()=>gsap.set(ico,{rotation:0})})};
  // the database matches from the START of name / username / Gmail / phone; ranking (and matching anywhere) works on every card loaded so far
  const title=v=>v.replace(/(^|\s)(\S)/g,(m,a,b)=>a+b.toUpperCase()),uniq=a=>[...new Set(a)];
  const pre=(f,x)=>getDocs(query(UC,where(f,'>=',x),where(f,'<=',x+'\uf8ff'),limit(SPAGE)));
  async function find(v0){const v=v0.replace(/^@/,''),t0=(v.split(/\s+/)[0]||'').toLowerCase();
    const jobs=[pre('username',t0),pre('email',t0),...uniq([v,title(v)]).map(x=>pre('name',x))];
    if(/^[+0-9][0-9\s-]*$/.test(v))uniq([v,v.replace(/[\s-]/g,'')]).forEach(x=>jobs.push(pre('phone',x)));
    const r=await Promise.allSettled(jobs);r.forEach(x=>x.status==='fulfilled'&&x.value.docs.forEach(d=>add(all,d)))}
  // steps run one after another (queue): never two animations at once
  const step=async(v,my)=>{await sp;if(my!==seq||dead)return;spinOff();await toTop();if(my!==seq||dead)return;await idle();if(my!==seq||dead)return;
    q=v;mode='find';settled=true;active=true;await doRender();syncMore()};
  const restore=async()=>{if(!active||dead)return;active=false;q='';mode='list';settled=true;await toTop();await idle();await doRender();setNF(false);syncMore()};
  inp.addEventListener('input',()=>{const v=inp.value.trim();clr.hidden=!inp.value;clearTimeout(tSrv);clearTimeout(tRun);const my=++seq;
    if(v.length<3){spinOff();chain=chain.then(()=>my===seq?restore():0).catch(()=>{});return}   // fewer than 3 letters: nothing moves
    spinOn();tSrv=setTimeout(()=>{sp=find(v)},350);tRun=setTimeout(()=>{chain=chain.then(()=>step(v,my)).catch(()=>{})},1000)});
  inp.addEventListener('keydown',e=>{if(e.key==='Enter')inp.blur()});
  clr.onclick=()=>{inp.value='';inp.dispatchEvent(new Event('input'));inp.focus()};
  return{start:()=>{live=true;dripNext=true;render()},stop:()=>{off=true;dead=true;unsub();clearTimeout(tSrv);clearTimeout(tRun);clearTimeout(cT);sc.removeEventListener('touchstart',tS);sc.removeEventListener('touchmove',tM);sc.removeEventListener('touchend',tE);sc.removeEventListener('touchcancel',tE);els.forEach(el=>gsap.killTweensOf(el));gsap.killTweensOf([ico,list,emp])}}}
return admPlayers}
</script>

</script>
<script type="text/plain" data-kind="app" data-order="205">
/* ===== pages/transactions/transactions.js ===== */
// ======================================================================
// @@TRANSACTIONS
// Admin Panel > Transactions page: all players' Add money / Withdraw requests.
// Called by initAdmin() in admin.html:  const admTransactions = txSetup(X);  ->  admTransactions({box}) gives { start, stop }.
// TODO (when the request system exists): read the requests from Firestore here, then draw them in txDraw(rows).
//   a request row is expected to look like: { name, username, type:'add'|'withdraw', amount:number, status:'pending'|'done'|'rejected', createdAt:Timestamp }
// ======================================================================
function txSetup(X){
const TX_ICON='<svg class="ico" viewBox="0 0 24 24"><path d="M7 4v14M3.5 14.5 7 18l3.5-3.5"/><path d="M17 20V6M13.5 9.5 17 6l3.5 3.5"/></svg>';
function admTransactions(U){
  const {box}=U;let on=false;
  // draws the page: no requests exist yet = one friendly box
  function txDraw(rows){
    box.innerHTML='';
    if(!rows||!rows.length){const d=document.createElement('div');d.className='empty';d.innerHTML=TX_ICON+'<p>No transactions yet</p>';box.appendChild(d);return}
  }
  txDraw([]);
  return{start:()=>{on=true},stop:()=>{on=false;gsap.killTweensOf(box);box.innerHTML=''}}}
return admTransactions}
</script>
<!-- ####  END OF FILE: transactions.html  #### -->

<!-- ################################################################################
     ####  @@LOADER  (bottom of the file - builds the app from the parts above)
     ################################################################################ -->
<script>
// ======================================================================
// @@LOADER - reads the parts that are already inside this single file, then builds the app exactly like the old multi-file version.
// Every section holds "parts": css / intro / app code (data-kind + data-order), page markup
// (<template data-stage>) and small shared markup (<template data-name>).
// Parts are sorted by data-order, so the code runs in the same order as before. Nothing is downloaded anymore.
// ======================================================================
(async function(){
  const fail=e=>{console.error('[loader]',e);const d=document.createElement('pre');
    d.style.cssText='position:fixed;inset:0;z-index:999999;margin:0;padding:24px;background:#fff;color:#d6452a;font:13px/1.6 monospace;white-space:pre-wrap;overflow:auto';
    d.textContent='Could not build the app.\n'+((e&&e.message)||e);
    document.body.append(d)};
  try{
    const parts={css:[],intro:[],app:[]},stages=[],names={};
    document.querySelectorAll('script[type="text/plain"][data-kind]').forEach(s=>parts[s.dataset.kind].push([+s.dataset.order,s.textContent]));
    [...document.body.children].forEach(el=>{
      if(el.tagName!=='TEMPLATE')return;
      if(el.dataset.stage)stages.push([+el.dataset.stage,el]);
      if(el.dataset.name)names[el.dataset.name]=el;
    });
    const sorted=a=>a.sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
    // 1) css
    const st=document.createElement('style');st.textContent=sorted(parts.css).join('\n');document.head.append(st);
    // 2) html (an included piece may include more pieces)
    const fill=frag=>{for(let n=0,list;(list=[...frag.querySelectorAll('[data-include]')]).length;n++){
      if(n>20)throw new Error('data-include loop');
      list.forEach(el=>{const t=names[el.dataset.include];if(!t)throw new Error('missing piece: '+el.dataset.include);el.replaceWith(t.content.cloneNode(true))})}return frag};
    const stage=document.getElementById('stage');
    sorted(stages).forEach(t=>stage.append(fill(t.content.cloneNode(true))));
    // 3) intro group (classic script)   4) app group (module)
    const run=(code,name,type)=>{const s=document.createElement('script');if(type)s.type=type;s.textContent=code+'\n//# sourceURL='+name;document.body.append(s)};
    run(sorted(parts.intro).join('\n'),'ultimate-tour-intro.js');
    run(sorted(parts.app).join('\n'),'ultimate-tour-app.js','module');
  }catch(e){fail(e)}
})();
</script>
</body>
</html>
