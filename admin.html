    const srSwap=on=>{if(on===srOn)return;srOn=on;gsap.killTweensOf(sr);   // the search bar belongs to Players only: it fades out / back in
      if(on){sr.style.display='';gsap.fromTo(sr,{opacity:0},{opacity:1,duration:.35,delay:.1,clearProps:'opacity'})}
      else gsap.to(sr,{opacity:0,duration:.2,onComplete:()=>{sr.style.display='none'}})};
    function showSec(n){
      if(n===sCur||n<0)return;
      const old=sCur,dir=n>old?1:-1,W=bd2.clientWidth,S0=bd2.scrollTop,S1=scrAt[SK[n]]||0,pg2=bd2.parentNode;
      scrAt[SK[old]]=S0;
      // every page that is on screen (except the one arriving) leaves the flow and stays exactly where it is, even though the scroll position changes to the new tab's
      SEC.forEach((el,i)=>{if(i===n||el.hidden)return;
        if(el.style.position==='absolute')el.style.top=(parseFloat(el.style.top)-S0+S1)+'px';
        else{const t=el.offsetTop;el.style.top=(t-S0+S1)+'px';el.style.left='16px';el.style.width=(W-32)+'px';el.style.position='absolute'}});
      const parked=SEC[n].hidden;
      if(parked){SEC[n].hidden=false;sPut(n,dir*W)}else sFree(n);
      bd2.scrollTop=S1;sCur=n;
      const jobs=[[n,0]];
      SEC.forEach((el,i)=>{if(i===n||el.hidden)return;
        const side=i===old?-dir:(SX[i]<0?-1:1);
        if(parked&&i!==old&&side===dir){sHide(i);return}
        jobs.push([i,side*W])});
      const far=Math.max(...jobs.map(([i,t])=>Math.abs(t-SX[i]))),dur=SLIDE.d*(.4+.6*Math.min(1,far/W));
      if(pg2&&pg2.classList)pg2.classList.add('mv');   // no blur on the glass bars while pages move (lighter for the phone)
      Promise.all(jobs.map(([i,t])=>sMove(i,t,dur))).then(()=>{if(pg2&&pg2.classList&&sCur===n&&!STW.some(Boolean))pg2.classList.remove('mv')})}
    tabs.forEach(b=>b.onclick=()=>{tabs.forEach(o=>o.classList.toggle('on',o===b));ballTo(b);showSec(SK.indexOf(b.dataset.k));srSwap(b.dataset.k==='players');b.scrollIntoView({behavior:'smooth',inline:'center',block:'nearest'})});
    const eng=admPlayers({list:bd2.querySelector('.pl-list'),emp:bd2.querySelector('.pl-empty'),cnt:sr.querySelector('.sr-cnt b'),inp:sr.querySelector('.sr-in'),clr:sr.querySelector('.sr-x'),sc:bd2,ico:sr.querySelector('.sr-i'),mel:bd2.querySelector('.pl-more')});
    const txEng=admTransactions({box:bd2.querySelector('#adm_transactions')});
    await verifyAnim();const pq=pp.getBoundingClientRect(),pR2={left:pq.left,right:pq.right,top:pq.top,bottom:pq.bottom};
    const pg=document.createElement('div');pg.className='adm-pg';document.body.append(pg);   // white page grows out of the pop-up
    gsap.set(pg,{clipPath:admClip(pR2,0,0,innerWidth,innerHeight,28)});
    await Promise.all([admCT(pg,admClip(pR2,0,0,innerWidth,innerHeight,28),'inset(0px 0px 0px 0px round 0px)',.95,E),pfTw(pp,{opacity:0,duration:.5,delay:.4}),pfTw(bd,{opacity:0,duration:.95})]);
    pp.style.pointerEvents='none';
    // --- the page is on screen: the glass bars appear first, then the cards (one frame later, so the opening never stutters)
    gsap.set([hd,nv,sr],{opacity:0,y:-14});
    pg.append(bd2,hd,nv,sr);
    ball.style.transition='none';ballTo(tabs[0]);ball.offsetWidth;ball.style.transition='';
    await new Promise(r=>requestAnimationFrame(()=>r()));
    gsap.fromTo(bk,{scale:0,rotation:90},{scale:1,rotation:0,duration:.5,ease:'back.out(1.8)'});
    gsap.to([hd,nv,sr],{opacity:1,y:0,duration:.55,stagger:.22,ease:'power2.out',clearProps:'transform,opacity'});
    setTimeout(()=>{eng.start();txEng.start()},950);
    bk.onclick=async()=>{bk.onclick=null;eng.stop();txEng.stop();await Promise.all([pfTw(hd,{opacity:0,duration:.25}),pfTw(nv,{opacity:0,duration:.25}),pfTw(sr,{opacity:0,duration:.25}),pfTw(bd2,{opacity:0,duration:.25})]);   // the page shrinks straight into the Admin Panel box
      const r2=admBtn.getBoundingClientRect(),cl=admBtn.cloneNode(true);cl.removeAttribute('id');
      cl.style.cssText='position:fixed;left:'+r2.left+'px;top:'+r2.top+'px;width:'+r2.width+'px;height:'+r2.height+'px;margin:0;opacity:0;pointer-events:none;background:transparent;box-shadow:none';pg.append(cl);   // the box's logo/label fade in as the page arrives
      await Promise.all([admCT(pg,'inset(0px 0px 0px 0px round 0px)',admClip(r2,0,0,innerWidth,innerHeight,22),.95,E),pfTw(cl,{opacity:1,duration:.4,delay:.55})]);
      pg.remove();pp.remove();bd.remove();admBtn.style.opacity='';admBusy=false}};
  bd.onclick=()=>close();
  // --- Verify
  okb.onclick=()=>{if(okb._lk||done)return;
    if(pwIn.value===ADM_PW&&(!st.bp||bpIn.value.trim()===PF_BYPASS)){st={f:0,u:0,bp:false};admSet(st);enter();return}
    st.f=(st.f||0)+1;pwIn.value='';bpIn.value='';
    if(st.f>=3){st={f:0,u:Date.now()+DAY,bp:false};admSet(st);msg.textContent='';lockNow(true,true);reflow(false)}
    else{admSet(st);const n=3-st.f;msg.textContent='Wrong '+(st.bp?'password or code':'password')+' · '+n+(n===1?' try':' tries')+' left';
      gsap.fromTo([pwIn,bpIn],{x:-9},{x:0,duration:.5,ease:'elastic.out(1,.3)'})}};
  pp.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.matches('input')){e.preventDefault();okb.click()}});
  // --- secret: hold the locked Verify button for 10s = unlock + ask for the bypass code
  let hold=null,hx=0,hy=0;
  okb.addEventListener('pointerdown',e=>{if(!okb._lk||done)return;hx=e.clientX;hy=e.clientY;clearTimeout(hold);
    hold=setTimeout(()=>{st={f:0,u:0,bp:true};admSet(st);msg.textContent='';lockNow(false,true);reflow(true);try{navigator.vibrate&&navigator.vibrate(40)}catch(x){}},10000)});
  okb.addEventListener('pointermove',e=>{if(hold&&Math.hypot(e.clientX-hx,e.clientY-hy)>12){clearTimeout(hold);hold=null}});
  ['pointerup','pointercancel','pointerleave'].forEach(t=>okb.addEventListener(t,()=>{clearTimeout(hold);hold=null}));
  okb.addEventListener('contextmenu',e=>e.preventDefault())}


}
</script>
