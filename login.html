<script type="text/plain" data-kind="css" data-order="30">
/* ===== pages/login/login.css ===== */
/* @@LOGIN - shared form look (.field .btn .gbtn .forgot .eye) + login page */
/* login */
#login,#signup{position:absolute;inset:0;z-index:15;display:flex;overflow-y:auto;visibility:hidden;background:var(--cream);padding:calc(32px + env(safe-area-inset-top,0px)) 20px calc(32px + env(safe-area-inset-bottom,0px));font-size:16px}
.lg{margin:auto;width:min(100%,400px);display:grid;gap:16px}
.ttl{margin:0 0 14px;text-align:center;font:italic 600 clamp(44px,13vw,68px)/1 var(--serif);letter-spacing:-.02em}
.hl{background:linear-gradient(var(--lime),var(--lime)) 0 66%/100% 36% no-repeat;padding:0 .08em}
.field{position:relative;display:flex;align-items:center;gap:14px;padding:12px 16px 12px 12px;background:#fff;border-radius:18px;box-shadow:0 10px 24px rgba(60,72,140,.1);cursor:text;transition:transform .7s cubic-bezier(.2,.8,.2,1)}
.field:focus-within{transform:translateY(-2px)}
.ic{flex:none;width:42px;height:42px;border-radius:12px;background:var(--grad);color:#fff;display:grid;place-items:center;font:700 16px var(--mono)}
.tx{flex:1;min-width:0;display:grid;gap:5px}
.tx small{font:700 10px/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:#8791a8}
.tx input{all:unset;display:block;width:100%;min-width:0;font:500 17px/1.3 var(--sans);color:var(--ink);caret-color:var(--pri)}
.tx input::placeholder{color:#b6bdd0}
.glow{position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity .8s ease-in-out;animation:breathe 2.4s ease-in-out infinite alternate}
.field:focus-within .glow{opacity:1;transition-duration:1.4s;transition-timing-function:cubic-bezier(.25,.6,.3,1)}
@keyframes breathe{from{box-shadow:0 0 0 1.5px rgba(79,116,244,.8),0 0 14px rgba(79,116,244,.28)}to{box-shadow:0 0 0 1.5px #4f74f4,0 0 30px rgba(79,116,244,.5)}}
.btn{margin-top:6px;display:flex;align-items:center;justify-content:center;gap:12px;padding:18px;border:0;border-radius:99px;background:var(--grad);box-shadow:0 12px 26px rgba(79,86,230,.32);color:#fff;font:700 14px var(--mono);letter-spacing:.18em;text-transform:uppercase;cursor:pointer;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:12px;padding:16px;border:1.5px solid rgba(30,41,100,.14);border-radius:99px;background:#fff;color:var(--ink);font:700 13px var(--mono);letter-spacing:.1em;text-transform:uppercase;cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.gbtn:active{transform:scale(.98)}
.btn i{width:9px;height:9px;border-radius:50%;background:#fff}
.btn:active{transform:scale(.98)}
.forgot{all:unset;justify-self:end;margin-top:-6px;cursor:pointer;font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);border-bottom:2px solid var(--lime);padding-bottom:3px}
.signup{margin:2px 0 0;text-align:center;font:500 12px/1.7 var(--mono);color:#566078}
.signup button{all:unset;cursor:pointer;font-weight:700;color:var(--ink);border-bottom:2px solid var(--lime);-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation}
.signup button:focus:not(:focus-visible){outline:none}
#login button,#login .signup{-webkit-tap-highlight-color:transparent}
.btn span,.ic b{display:inline-block}
.eye{all:unset;flex:none;width:36px;height:36px;display:grid;place-items:center;color:#8791a8;cursor:pointer;border-radius:10px;transition:color .25s;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.eye:hover{color:var(--ink)}
.eye svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.eye .sl{stroke-dasharray:1;stroke-dashoffset:1;opacity:0;transition:stroke-dashoffset .45s cubic-bezier(.65,0,.35,1),opacity .12s linear .33s}
.eye[aria-pressed=true] .sl{stroke-dashoffset:0;opacity:1;transition:stroke-dashoffset .45s cubic-bezier(.65,0,.35,1),opacity .05s linear}
.forgot:focus-visible,.signup button:focus-visible,.eye:focus-visible,.btn:focus-visible{outline:2px solid var(--green);outline-offset:3px}
.signup button::selection,.signup button *::selection{background:transparent}
</script>
<script type="text/plain" data-kind="intro" data-order="40">
/* ===== pages/login/login.intro.js ===== */
// @@LOGIN - password eye toggle on the login page
const eye=$('#eye'),pw=$('#pw');
eye.addEventListener('pointerdown',e=>e.preventDefault());
eye.onclick=()=>{const on=pw.type==='password';pw.type=on?'text':'password';eye.setAttribute('aria-pressed',on);eye.setAttribute('aria-label',on?'Hide password':'Show password')};
</script>
<script type="text/plain" data-kind="app" data-order="90">
/* ===== pages/login/login.js ===== */
// ======================================================================
// @@PAGE-LOGIN   Login page: email + password button
//   HTML: <!-- @@LOGIN -->  CSS: /* @@LOGIN */
// ======================================================================
// Email + password login (text gathers into a ball > spinner > tick > box expands to home or the verify page)
q('#login .btn').onclick=e=>{const b=e.currentTarget;return run(b,lgF,async()=>{
  const em=lgF.username.value.trim(),pw=lgF.password.value;
  if(!em)throw{code:'app/email-empty'};
  if(!MAIL.test(em))throw{code:'auth/invalid-email'};
  await animRun(b,async()=>{
    const m=await fetchSignInMethodsForEmail(auth,em).catch(()=>[]);
    if(m.includes('google.com')&&!m.includes('password'))throw{code:'app/use-google'};
    if(!pw)throw{code:'app/pw-empty'};
    const {user}=await signInWithEmailAndPassword(auth,em,pw);
    if(!user.emailVerified)return user;
    return await getProfile(user)||await makeProfile(user)})},false)};


</script>
<script type="text/plain" data-kind="app" data-order="100">
/* ===== pages/login/login-google.js ===== */
// ======================================================================
// @@PAGE-GOOGLE   Continue with Google (login + signup pages)
// ======================================================================
async function finishGoogle(btn,user){const g=gAnim(btn);try{await g.eat();const p=await getProfile(user)||await autoProfile(user);await g.done();await g.expand();enter(p);g.fade()}catch(e){g.reset();throw e}}
const google=btn=>run(btn,sgOn()?sgF:lgF,async()=>{
  const gp=new GoogleAuthProvider();gp.setCustomParameters({prompt:'select_account'});
  try{sessionStorage.setItem('ut_g','1')}catch(x){}
  let user;try{({user}=await signInWithPopup(auth,gp))}finally{try{sessionStorage.removeItem('ut_g')}catch(x){}}
  await finishGoogle(btn,user)},false);
document.querySelectorAll('.gbtn').forEach(b=>b.onclick=()=>google(b));


</script>

      <label class="field"><i class="ic"><b class="tt" data-g="2">***</b></i><span class="tx"><small class="tt" data-g="2">Password</small><input id="pw" class="tt" data-g="2" type="password" name="password" autocomplete="current-password" placeholder="••••••••"></span><button id="eye" class="eye tt" data-g="2" type="button" aria-label="Show password" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M1.5 12S5.5 4.5 12 4.5 22.5 12 22.5 12 18.5 19.5 12 19.5 1.5 12 1.5 12z"/><circle cx="12" cy="12" r="3"/><path class="sl" pathLength="1" d="M3.5 3.5l17 17"/></svg></button><i class="glow"></i></label>
