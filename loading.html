<!--
Page 1+2: Loading (without login / with login) - loading animation, shared loading css, loading wipe
This file is NOT opened directly. index.html loads it. It holds this page's css + html + js together.
-->
<script type="text/plain" data-kind="css" data-order="20">
/* ===== pages/loading/loading.css ===== */
/* @@LOADING - intro animation: HUD, scenes, flood, wipe (CSS down to the login block) */
/* HUD */
#hud{position:absolute;inset:0;z-index:30;opacity:0;pointer-events:none;--m:clamp(12px,2.2rem,40px);--k:clamp(14px,2.2rem,40px);font:700 clamp(9px,.78rem,14px)/1 var(--mono);letter-spacing:.12em;text-transform:uppercase}
#hud>*{position:absolute}
.k{width:var(--k);height:var(--k);border:0 solid var(--ink)}
.tl{left:var(--m);top:calc(var(--m) + env(safe-area-inset-top,0px));border-width:2px 0 0 2px}
.tr{right:var(--m);top:calc(var(--m) + env(safe-area-inset-top,0px));border-width:2px 2px 0 0}
.bl{left:var(--m);bottom:calc(var(--m) + env(safe-area-inset-bottom,0px));border-width:0 0 2px 2px}
.br{right:var(--m);bottom:calc(var(--m) + env(safe-area-inset-bottom,0px));border-width:0 2px 2px 0}
.row{left:calc(var(--m) + var(--k)*1.4);right:calc(var(--m) + var(--k)*1.4);display:flex;align-items:center;justify-content:space-between}
.top{top:calc(var(--m) + env(safe-area-inset-top,0px) + var(--k)*.55)}
.bot{bottom:calc(var(--m) + env(safe-area-inset-bottom,0px) + var(--k)*.25)}
.dim{opacity:.55;font-weight:400}
.rec{display:inline-block;width:.6rem;height:.6rem;border-radius:50%;background:var(--wal-l);margin-right:.8rem;animation:b 1s steps(2) infinite}
@keyframes b{50%{opacity:.2}}
#trk{flex:1;margin:0 4rem;height:1px;background:rgba(0,0,0,.18);position:relative}
#bar{position:absolute;left:0;top:-.5px;height:2px;background:var(--ink);width:0}
/* scene 1 */
.c{position:absolute;left:50%;top:50%;width:0;height:0}
#s1{z-index:5}
#s1 *{position:absolute}
#ball{width:3rem;height:3rem;left:-1.5rem;top:-1.5rem;border-radius:50%;background:radial-gradient(circle at 35% 30%,#cdd8ff,var(--wal-l) 55%,#5f80f2);transform-origin:50% 100%}
#sh{width:5rem;height:.9rem;left:-2.5rem;top:2rem;border-radius:50%;background:rgba(0,0,0,.22);filter:blur(3px);opacity:0}
#r1{width:30rem;height:30rem;left:-15rem;top:-15rem;border:.4rem solid var(--wal-l);border-radius:50%;opacity:0}
#r2{width:70rem;height:70rem;left:-35rem;top:-35rem;border:1px solid #999;border-radius:50%;opacity:0}
#orb{width:26rem;height:9rem;left:-13rem;top:-4.5rem;border:.18rem solid var(--ink);border-radius:50%;opacity:0}
.arm{left:0;top:0;width:0;height:0}
.b{left:1.5rem;top:-.4rem;width:4.7rem;height:.8rem;background:var(--ink);border-radius:.4rem;transform-origin:0 50%}
.d{left:8rem;top:-1.45rem;width:2.9rem;height:2.9rem;border-radius:50%;background:var(--ink)}
#deb i{left:0;top:0;border-radius:50%;opacity:0}
#tw{left:-30rem;top:13.5rem;width:60rem;text-align:center;font:400 1.1rem var(--mono);letter-spacing:.15em;opacity:0;white-space:pre}
/* flood */
#flood,#hole{position:absolute;inset:0;clip-path:circle(0% at 50% 50%)}
#flood{background:var(--grad-l);z-index:10}
#hole{background:var(--cream);z-index:11}
/* scene 2 */
#s2{position:absolute;inset:0;display:grid;place-items:center;z-index:12;visibility:hidden}
#dl{position:relative;transform:translateY(-4rem)}
#word{margin:0;font:italic 600 12rem/1 var(--serif);letter-spacing:-.02em;position:relative;z-index:2;white-space:nowrap;clip-path:inset(-25% -10% 8% -10%)}
.l{display:inline-block}
#hl{position:absolute;left:12%;width:70%;top:50%;height:11%;background:var(--wal-l);transform-origin:0 50%;z-index:1}
#pill{position:absolute;left:50%;top:14rem;z-index:3;display:flex;align-items:center;gap:1.4rem;padding:1.3rem 2.8rem 1.3rem 2.2rem;background:var(--ink);border-radius:9rem;white-space:nowrap}
#pdot{width:.9rem;height:.9rem;border-radius:50%;background:var(--wal-l)}
#pl{font:400 1rem var(--mono);letter-spacing:.2em;color:#8791a8;text-transform:uppercase}
#clk{font:700 3.4rem var(--mono);color:var(--wal-l)}
.chip{position:absolute;z-index:3;display:flex;align-items:center;gap:1.1rem;padding:1.1rem 1.6rem 1.1rem 1.1rem;background:#fff;border-radius:1.6rem;box-shadow:0 1rem 2.4rem rgba(0,0,0,.1);white-space:nowrap}
.chip b{width:3.4rem;height:3.4rem;border-radius:1rem;background:var(--grad);color:#fff;display:grid;place-items:center;font:700 1.6rem var(--mono)}
.chip strong{display:block;font:700 1.9rem/1.1 var(--sans);letter-spacing:-.02em}
.chip small{font:700 .9rem var(--mono);color:var(--wal);letter-spacing:.1em;text-transform:uppercase}
#cl{position:absolute;inset:0;z-index:3}
/* scene 3 */
#t2{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;z-index:12;visibility:hidden;text-wrap:balance}
.ln{overflow:hidden;padding:.6rem 1rem .9rem;max-width:94vw}
#a1,#a2{display:block}
#a1{white-space:nowrap;font:800 6.6rem/1.05 var(--sans);letter-spacing:-.045em}
#a2{font:italic 500 7.2rem/1.1 var(--serif);color:var(--ink);letter-spacing:-.02em}
#mk{background:linear-gradient(var(--wal-l),var(--wal-l)) 0 62%/0% 60% no-repeat}
/* wipe */
#wipe{position:absolute;inset:0;z-index:40;pointer-events:none;overflow:hidden;display:grid;grid-template-rows:repeat(6,1fr)}
.band{background:#080a10;position:relative;will-change:transform;backface-visibility:hidden;box-shadow:0 1px 0 #080a10}
.band:nth-child(n+4)::after{right:auto;left:-2.2rem;background:linear-gradient(270deg,rgba(79,116,244,.6),transparent)}
.band::after{content:"";position:absolute;right:-2.2rem;top:0;bottom:0;width:2.2rem;background:linear-gradient(90deg,rgba(79,116,244,.6),transparent)}
</script>
<script type="text/plain" data-kind="intro" data-order="10">
/* ===== pages/loading/loading-core.intro.js ===== */
// ======================================================================
// @@LOADING (shared)
// Shared by both loading animations: helpers, AUTO flag, DOM pieces, progress, and tail() = black strips -> login/home.
// ======================================================================
// @@LOADING - intro animation: scenes, timeline, start()  (down to the eye toggle)
const $=s=>document.querySelector(s),p2=n=>String(n).padStart(2,'0');
const SPEED=1; // 1 = normal, 1.5 = faster

// build DOM pieces
$('#g').innerHTML='<div class="arm"><i class="b"></i><i class="d"></i></div>'.repeat(8);
$('#word').innerHTML=[...'Ultimate Tour'].map(c=>`<span class="l">${c==' '?'&nbsp;':c}</span>`).join('');
const D=[];
for(let i=0;i<16;i++){const e=document.createElement('i'),s=.5+Math.random()*1.4;e.style.cssText=`width:${s}rem;height:${s}rem;background:${i%4?'var(--ink)':'var(--wal-l)'}`;$('#deb').append(e);D.push(e)}

const lab=$('#lab'),clk=$('#clk'),tw=$('#tw');
const fmt=v=>{v=Math.round(v);return [v/3600|0,(v%3600)/60|0,v%60].map(p2).join(':')};
const toC=(e,y)=>{const r=e.getBoundingClientRect();return y?innerHeight/2-r.top-r.height/2:innerWidth/2-r.left-r.width/2};
let tl;
window.AUTO={state:'wait',cb:null}; // set by the module: 'home' = already logged in (open home straight after the intro), 'login' = show login
function tick(){const t=tl.time();$('#tc').textContent=`TC 00:00:${p2(Math.floor(t))}:${p2(Math.floor((t%1)*60))}`;$('#bar').style.width=tl.progress()*100+'%'}
function done(){dispatchEvent(new Event('loader:done'))}

// bands cover the screen -> black -> bands leave -> login shows (or home opens if already logged in)
function tail(Y){
  // 8 — glitch stair-step to black
  tl.to('.band',{xPercent:0,duration:.8,stagger:i=>[0,2,4,1,3,5][i]*.09,ease:'power3.inOut'},Y);

  // 9 — brief black, strips leave the opposite way; login boxes show, then texts float up top→bottom
  const cover=Y+.8+.45,go=cover+.02;
  tl.call(()=>{if(AUTO.state!=='wait')return;tl.pause();const tm=setTimeout(()=>{AUTO.state='login';AUTO.cb()},5000);AUTO.cb=()=>{clearTimeout(tm);AUTO.cb=null;tl.play()}},null,cover-.02)
    .set('#login',{visibility:'visible'},cover)
    .call(()=>{if(AUTO.state==='home'&&AUTO.show)AUTO.show()},null,cover+.01)
    .set('#hud',{autoAlpha:0},cover)
    .set('#s2',{visibility:'hidden'},cover)
    .to('.band',{xPercent:i=>i<3?105:-105,duration:.7,stagger:i=>[0,2,4,1,3,5][i]*.07,ease:'power2.inOut'},go)
    .call(()=>{if(AUTO.state==='home'&&AUTO.reveal)AUTO.reveal()},null,go+.15)
    .fromTo('.field,.btn,.gbtn',{y:20,opacity:0},{y:0,opacity:1,duration:.8,ease:'power3.out',stagger:.1,clearProps:'transform'},go+.05)
    .fromTo('.tt',{y:14,opacity:0},{y:0,opacity:1,duration:.7,ease:'power3.out',stagger:(i,el)=>el.dataset.g*.14},go+.85);
}
</script>
<script type="text/plain" data-kind="intro" data-order="20">
/* ===== pages/loading/loading-without-login.intro.js ===== */
// ======================================================================
// @@LOADING (without login)
// Full intro animation (agent chips, timer, tagline). Used when nobody is logged in.
// ======================================================================
// [glyph, title, sub, landscape x,y,rot, portrait x,y,rot]  (x,y in rem from screen center)
const CHIPS=[
['‹›','All Ai Agents Pro','Api . OB . 01.00',-30,-16,-5,-18,-17,-5],
['◔','Support Agent','High - 01.00',0,-19,-2,0,-26,-2],
['▤','Dashboard Auto','High - 01.00',30,-16,4,19,-18,4],
['▥','Analysis Agent','Pro . OB',-34,8,4,-19,18,4],
['▣','Security Agent','Max - Go',34,8,-4,19,19,-4],
['◉','Automation','On 0.10 Pro',-20,19,-3,-12,27,-3],
['▦','Payment Pro','Instant-01.00',20,19,5,17,28,5]];

function build(){
  if(isKnown())return buildQuick();
  const u=parseFloat(getComputedStyle(document.documentElement).fontSize),H=innerHeight;
  const P=innerWidth<innerHeight,o=P?6:3;
  CHIPS.forEach(c=>$('#cl').insertAdjacentHTML('beforeend',`<div class="chip" style="left:calc(50% + ${c[o]}rem);top:calc(50% + ${c[o+1]}rem)" data-r="${c[o+2]}"><b>${c[0]}</b><div><strong>${c[1]}</strong><small>${c[2]}</small></div></div>`));
  gsap.set('.arm',{rotation:i=>i*45});
  gsap.set('.chip',{xPercent:-50,yPercent:-50,rotation:(i,e)=>+e.dataset.r});
  gsap.set(D,{xPercent:-50,yPercent:-50});
  gsap.set('#pill',{xPercent:-50});
  gsap.set('#hl',{rotation:-.8});
  gsap.set('.band',{xPercent:i=>i<3?-105:105});
  tl=gsap.timeline({paused:true,onUpdate:tick,onComplete:done});
  tl.timeScale(SPEED);

  // 0 — white page, HUD fades in
  tl.to('#stage',{backgroundColor:'#eef2fb',duration:.6},0)
    .fromTo('#hud',{opacity:0},{opacity:1,duration:1,ease:'power2.out'},1.0)
    .fromTo('.tl,.tr,.top',{y:-1.2*u},{y:0,duration:1.1,ease:'power3.out'},1.0)
    .fromTo('.bl,.br,.bot',{y:1.2*u},{y:0,duration:1.1,ease:'power3.out'},1.0);

  // 1 — lime ball drops, bounces
  tl.fromTo('#ball',{y:-(H/2+3*u)},{y:0,duration:.7,ease:'power2.in'},.25)
    .fromTo('#sh',{opacity:0,scale:.3},{opacity:1,scale:1,duration:.7,ease:'power2.in'},.25)
    .to('#ball',{scaleX:1.35,scaleY:.65,duration:.07},.95)
    .to('#ball',{y:-6*u,scaleX:.92,scaleY:1.08,duration:.3,ease:'power2.out'},1.02)
    .to('#sh',{scale:.55,opacity:.5,duration:.3,ease:'power2.out'},1.02)
    .to('#ball',{y:0,scaleX:1,scaleY:1,duration:.22,ease:'power2.in'},1.32)
    .to('#sh',{scale:1,opacity:1,duration:.22,ease:'power2.in'},1.32);

  // 2 — burst into the shape
  const B=1.54;
  tl.to('#ball',{scale:1.25,duration:.1,yoyo:true,repeat:1},B)
    .to('#sh',{opacity:0,duration:.3},B)
    .set('#r1',{opacity:1,scale:.15},B).to('#r1',{scale:2,opacity:0,duration:1,ease:'power2.out'},B)
    .set('#r2',{opacity:.8,scale:.2},B+.1).to('#r2',{scale:1.15,opacity:0,duration:1.2,ease:'power2.out'},B+.1)
    .fromTo('.b',{scaleX:0},{scaleX:1,duration:.45,stagger:.025,ease:'back.out(1.8)'},B+.08)
    .fromTo('.d',{scale:0,x:-5*u},{scale:1,x:0,duration:.55,stagger:.03,ease:'back.out(2)'},B+.08);
  D.forEach(e=>{const a=Math.random()*6.283,r=(5+Math.random()*10)*u;
    tl.set(e,{opacity:1,x:0,y:0,scale:1},B).to(e,{x:Math.cos(a)*r,y:Math.sin(a)*r,scale:.3,opacity:0,duration:1+Math.random()*.5,ease:'power3.out'},B)});
  const msg='> All Ultimate Servers - Online',T={n:0};
  tl.set('#tw',{opacity:1},B+.5).to(T,{n:msg.length,duration:.9,ease:'none',onUpdate:()=>{tw.textContent=msg.slice(0,Math.round(T.n))+'▌'}},B+.5);

  // 3 — spin with orbit, then collapse
  tl.to('#g',{rotation:180,duration:.95,ease:'power3.inOut'},2.15)
    .to('#g',{filter:'blur(2.5px)',duration:.25,yoyo:true,repeat:1},2.3)
    .set('#orb',{opacity:1,scale:.6,rotation:-30},2.15).to('#orb',{scale:1,rotation:-16,duration:.5,ease:'power2.out'},2.15).to('#orb',{opacity:0,duration:.3},2.8)
    .to('#tw',{opacity:0,duration:.2},3.2)
    .to('.d',{x:-3.2*u,scale:.55,duration:.35,ease:'power2.in'},3.3)
    .to('#g',{scale:.6,filter:'blur(1.5px)',duration:.35,ease:'power2.in'},3.3);

  // 4 — lime flood, cream circle opens
  tl.to('#flood',{clipPath:'circle(75% at 50% 50%)',duration:.4,ease:'power3.in'},3.65)
    .set('#s1',{visibility:'hidden'},4.05)
    
    .to('#hole',{clipPath:'circle(75% at 50% 50%)',duration:.55,ease:'power3.out'},4.05)
    .set('#s2',{visibility:'visible'},4.05);

  // 5 — "Deadline", timer, highlight, chips
  const C={v:10*3600};clk.textContent=fmt(C.v);
  tl.fromTo('.l',{yPercent:115,rotation:7,skewX:-10,opacity:0},{yPercent:0,rotation:0,skewX:0,opacity:1,duration:.75,stagger:.04,ease:'power3.out'},4.25)
    .fromTo('#pill',{opacity:0,scale:.6},{opacity:1,scale:1,duration:.5,ease:'back.out(2)'},4.75)
    .to(C,{v:0,duration:1.4,ease:'power2.out',onUpdate:()=>{clk.textContent=fmt(C.v)}},4.85)
    .to('#clk',{color:'#7b99f6',duration:.2},6.25).to('#pdot',{backgroundColor:'#7b99f6',duration:.2},6.25)
    .fromTo('#hl',{scaleX:0},{scaleX:1,duration:.5,ease:'power3.inOut'},5.4)
    .fromTo('.chip',{opacity:0,scale:.5,y:3*u},{opacity:1,scale:1,y:0,duration:.5,stagger:.08,ease:'back.out(1.8)'},5.5);

  // 6 — everything whirls into the center and out
  const X=6.9;
  tl.to('.chip',{x:(i,e)=>toC(e,0),y:(i,e)=>toC(e,1),scale:.3,opacity:0,filter:'blur(6px)',duration:.5,stagger:.03,ease:'power3.in'},X)
    .to('.l',{yPercent:-120,skewX:8,opacity:0,filter:'blur(6px)',duration:.4,stagger:.015,ease:'power3.in'},X+.1)
    .to('#pill,#hl',{opacity:0,scale:.7,duration:.3},X+.05)
    .set('#t2',{visibility:'visible'},X+.45)
    .set('#s2',{visibility:'hidden'},X+.7);

  // 7 — tagline
  const Y=X+.5;
  tl.fromTo('#a1',{yPercent:110},{yPercent:0,duration:.6,ease:'power4.out'},Y)
    .fromTo('#a2',{yPercent:110},{yPercent:0,duration:.6,ease:'power4.out'},Y+.12)
    .to('#mk',{backgroundSize:'100% 60%',duration:.5,ease:'power3.inOut'},Y+.5);

  tail(Y+1.7);
}
</script>
<script type="text/plain" data-kind="intro" data-order="30">
/* ===== pages/loading/loading-with-login.intro.js ===== */
// ======================================================================
// @@LOADING (with login)
// Short intro for an already logged-in user: only the "Ultimate Tour" word, then the strips open straight into Home.
// ======================================================================
// ---- Already logged in (flag 'ut_in' saved by app.js): short intro = only the "Ultimate Tour" word floats in the center, then the black strips take over and open straight into home ----
function isKnown(){try{const s=new URLSearchParams(location.search);return localStorage.getItem('ut_in')==='1'&&AUTO.state!=='login'&&sessionStorage.getItem('ut_g')!=='1'&&!s.get('verified')&&!s.get('reset')&&!s.has('oobCode')}catch(e){return false}}
function buildQuick(){
  gsap.set('#stage',{backgroundColor:'#eef2fb'});
  gsap.set('#s1,#t2',{visibility:'hidden'});
  gsap.set('#s2',{visibility:'visible'});
  gsap.set('#pill,#cl',{display:'none'});   // no timer pill, no floating agent chips
  gsap.set('#dl',{y:0});                    // word sits exactly in the screen center
  gsap.set('#hl',{rotation:-.8});
  gsap.set('.band',{xPercent:i=>i<3?-105:105});
  tl=gsap.timeline({paused:true,onUpdate:tick,onComplete:done});
  tl.timeScale(SPEED);
  tl.fromTo('.l',{yPercent:115,rotation:7,skewX:-10,opacity:0},{yPercent:0,rotation:0,skewX:0,opacity:1,duration:.75,stagger:.04,ease:'power3.out'},.2)
    .fromTo('#hl',{scaleX:0},{scaleX:1,duration:.5,ease:'power3.inOut'},.9);
  tail(2.0);
}
</script>
<script type="text/plain" data-kind="intro" data-order="60">
/* ===== pages/loading/loading-start.intro.js ===== */
// ======================================================================
// @@LOADING start
// Waits for the fonts, then starts the intro. Must stay the LAST file of the "intro" list in core/manifest.js.
// ======================================================================
function start(){build();tl.play(0)}
Promise.race([
  Promise.all(['italic 600 16px Newsreader','800 16px "Inter Tight"','700 16px "JetBrains Mono"'].map(f=>document.fonts.load(f))),
  new Promise(r=>setTimeout(r,1500))
]).then(start);
</script>
