name: Render Video

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Render video
        run: npx remotion render index.ts Main out/video.mp4

      - name: Upload video artifact
        uses: actions/upload-artifact@v3
        with:
          name: promo-video
          path: out/video.mp4
